<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import * as React from "react";
    window.React = React;
  </script>

  <script type="text/babel" data-type="module">
    import { createRoot } from "react-dom/client";
    import {
      Plus, MousePointer2, Square, Minus as LineIcon, ArrowRight, MapPin,
      Trash2, Undo2, Redo2, Download, Upload, Map as MapIcon, X, ChevronLeft, Pin,
      Copy, AlignLeft, AlignRight, LayoutGrid, RotateCcw
    } from "lucide-react";
    import { create } from "zustand";
    import { marked } from "marked";
    import * as Tooltip from "@radix-ui/react-tooltip";
    import * as Dialog from "@radix-ui/react-dialog";
    import * as Popover from "@radix-ui/react-popover";
    import * as ToggleGroup from "@radix-ui/react-toggle-group";
    import * as ScrollArea from "@radix-ui/react-scroll-area";
    import * as VisuallyHidden from "@radix-ui/react-visually-hidden";

    marked.use({ breaks: true, gfm: true });
    const renderMarkdownSafe = (text) => text ? marked.parse(text) : '';

// ========== IndexedDB 图片存储 ==========
    const IMAGE_DB_NAME = 'WhiteboardImages', IMAGE_STORE_NAME = 'images';
    let dbPromise = null;
    function openImageDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(IMAGE_DB_NAME, 1);
        req.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(IMAGE_STORE_NAME)) db.createObjectStore(IMAGE_STORE_NAME, { keyPath: 'id' }); };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
      return dbPromise;
    }
    async function saveImageToDB(id, blob) { const db = await openImageDB(); return new Promise((res, rej) => { const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite'); const store = tx.objectStore(IMAGE_STORE_NAME); store.put({ id, blob }); tx.oncomplete = res; tx.onerror = rej; }); }
    async function getImageFromDB(id) { const db = await openImageDB(); return new Promise((res, rej) => { const tx = db.transaction(IMAGE_STORE_NAME, 'readonly'); const req = tx.objectStore(IMAGE_STORE_NAME).get(id); req.onsuccess = () => res(req.result?.blob ?? null); req.onerror = rej; }); }
    async function deleteImageFromDB(id) { const db = await openImageDB(); return new Promise((res, rej) => { const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite'); tx.objectStore(IMAGE_STORE_NAME).delete(id); tx.oncomplete = res; tx.onerror = rej; }); }
    function compressImageToWebP(blob) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > 800) { h = (h / w) * 800; w = 800; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((b) => b ? res(b) : rej(new Error('压缩失败')), 'image/webp', 0.5);
        };
        img.onerror = rej;
        img.src = URL.createObjectURL(blob);
      });
    }
    async function blobToBase64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onloadend = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
    function base64ToBlob(base64, mime = 'image/webp') { const bs = atob(base64.split(',')[1]); const ab = new ArrayBuffer(bs.length); const ia = new Uint8Array(ab); for (let i = 0; i < bs.length; i++) ia[i] = bs.charCodeAt(i); return new Blob([ab], { type: mime }); }

// ========== 图片节点工具 ==========
    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function getNodeImageElement(node) {
      const blob = await getNodeImageBlob(node);
      if (!blob) throw new Error('图片数据不存在');
      const url = URL.createObjectURL(blob);
      try {
        return await loadImageElement(url);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function getNodeImageBlob(node) {
      if (node.imageId) {
        const blob = await getImageFromDB(node.imageId);
        if (blob) return blob;
      }
      if (node.src) {
        const res = await fetch(node.src);
        if (res.ok) return res.blob();
      }
      return null;
    }

    async function imageNodeToBlob(node, mime = 'image/webp', quality = 0.92) {
      const blob = await getNodeImageBlob(node);
      if (!blob) throw new Error('图片数据不存在');
      const url = URL.createObjectURL(blob);
      try {
        const img = await loadImageElement(url);
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        if (mime === 'image/jpeg') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0);
        return await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('图片转换失败')), mime, quality));
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function copyImageToClipboard(node) {
      if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') throw new Error('当前浏览器不支持写入图片剪贴板');
      const png = await imageNodeToBlob(node, 'image/png');
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    }

    async function downloadNodeImage(node, mime, ext, quality = 0.92) {
      const blob = await imageNodeToBlob(node, mime, quality);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `whiteboard_image_${node.id}.${ext}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }


async function addImageNodeFromBlob(blob, wx, wy) {
      const originalUrl = URL.createObjectURL(blob);
      let committed = false;
      try {
        const img = await loadImageElement(originalUrl);
        const originalWidth = img.naturalWidth || img.width;
        const originalHeight = img.naturalHeight || img.height;
        const cb = await compressImageToWebP(blob);
        const imageId = genId();
        await saveImageToDB(imageId, cb);
        useStore.getState().addNode({
          id: genId(),
          type: 'image',
          x: wx - originalWidth / 2,
          y: wy - originalHeight / 2,
          width: originalWidth,
          height: originalHeight,
          originalWidth,
          originalHeight,
          src: originalUrl,
          imageId,
        });
        committed = true;
      } finally {
        if (!committed) URL.revokeObjectURL(originalUrl);
      }
    }

function getNodeBounds(node) {
      if (node.type === 'line' || node.type === 'arrow') {
        const x1 = node.x, y1 = node.y, x2 = node.x2 ?? node.x + (node.width || 0), y2 = node.y2 ?? node.y + (node.height || 0);
        return { x: Math.min(x1, x2), y: Math.min(y1, y2), width: Math.abs(x2 - x1), height: Math.abs(y2 - y1) };
      }
      return { x: node.x, y: node.y, width: node.width || 60, height: node.height || 30 };
    }

    function buildNodeMove(node, newX, newY) {
      const b = getNodeBounds(node);
      if (node.type === 'line' || node.type === 'arrow') {
        const dx = newX - b.x, dy = newY - b.y;
        return { x: node.x + dx, y: node.y + dy, x2: (node.x2 ?? node.x + (node.width || 0)) + dx, y2: (node.y2 ?? node.y + (node.height || 0)) + dy };
      }
      return { x: newX, y: newY };
    }

    function computeAutoLayout(nodes, regionW, regionH) {
      const gap = 16;
      const margin = Math.min(regionW, regionH) * 0.08;
      const targetW = Math.max(80, regionW - margin * 2), targetH = Math.max(80, regionH - margin * 2);
      const items = nodes.map(n => ({ node: n, bounds: getNodeBounds(n) })).sort((a, b) => a.bounds.y - b.bounds.y || a.bounds.x - b.bounds.x);
      if (!items.length) return new Map();
      let best = null;
      for (let cols = 1; cols <= items.length; cols++) {
        const rows = Math.ceil(items.length / cols);
        let layoutH = 0, layoutW = 0;
        for (let r = 0; r < rows; r++) {
          const row = items.slice(r * cols, r * cols + cols);
          const rowW = row.reduce((sum, i) => sum + i.bounds.width, 0) + (row.length - 1) * gap;
          layoutW = Math.max(layoutW, rowW);
          layoutH += Math.max(...row.map(i => i.bounds.height));
          if (r < rows - 1) layoutH += gap;
        }
        const w = Math.max(1, layoutW);
        const h = Math.max(1, layoutH);
        const fits = w <= targetW && h <= targetH;
        const diff = Math.abs(w / h - regionW / regionH);
        const area = w * h;
        const score = fits ? area + 1e9 : area;
        if (!best || score > best.score || (score === best.score && diff < best.diff)) best = { cols, w, h, score, diff };
      }
      const startX = Math.max(0, (regionW - best.w) / 2), startY = Math.max(0, (regionH - best.h) / 2);
      const updates = new Map();
      let y = startY;
      for (let r = 0; r < Math.ceil(items.length / best.cols); r++) {
        const row = items.slice(r * best.cols, r * best.cols + best.cols);
        const rowMaxH = Math.max(...row.map(i => i.bounds.height));
        let x = startX;
        for (const item of row) {
          updates.set(item.node.id, buildNodeMove(item.node, x, y));
          x += item.bounds.width + gap;
        }
        y += rowMaxH + gap;
      }
      return updates;
    }

    function computeAlignment(nodes, mode) {
      const items = nodes.map(n => ({ node: n, bounds: getNodeBounds(n) })).sort((a, b) => a.bounds.y - b.bounds.y || a.bounds.x - b.bounds.x);
      if (items.length < 2) return new Map();
      const refX = mode === 'left' ? Math.min(...items.map(i => i.bounds.x)) : Math.max(...items.map(i => i.bounds.x + i.bounds.width));
      const updates = new Map();
      let y = items[0].bounds.y;
      for (const item of items) {
        const x = mode === 'left' ? refX : refX - item.bounds.width;
        updates.set(item.node.id, buildNodeMove(item.node, x, y));
        y += item.bounds.height + 16;
      }
      return updates;
    }

    const genId = () => `n_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const deepClone = (obj) => JSON.parse(JSON.stringify(obj));
    const getBoardIdFromHash = () => new URLSearchParams(window.location.hash.slice(1)).get('id') || null;
    const setBoardIdToHash = (id) => { window.location.hash = `id=${encodeURIComponent(id)}`; };
    const clearHash = () => { window.location.hash = ''; };

// ========== Zustand Store ==========
    const useStore = create((set, get) => {
      const persistNode = n => n && n.type === 'image' && n.imageId ? { ...n, src: undefined } : n;
      const persistSnapshot = snap => snap ? { ...snap, nodes: (snap.nodes || []).map(persistNode) } : snap;
      const persistBoard = b => b ? { ...b, nodes: (b.nodes || []).map(persistNode), history: b.history ? { ...b.history, past: (b.history.past || []).map(persistSnapshot), future: (b.history.future || []).map(persistSnapshot) } : b.history } : b;
      const loadBoards = () => { try { const raw = JSON.parse(localStorage.getItem('wb_boards_v6')) || {}; const saved = {}; for (const [id, b] of Object.entries(raw)) saved[id] = persistBoard(b); return saved; } catch { return {}; } };
      const saved = loadBoards();
      const hashId = getBoardIdFromHash();
      const initialBoardId = hashId && saved[hashId] ? hashId : null;
      const initialView = initialBoardId ? 'canvas' : 'board-list';
      let saveTimer;
      const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { const { boards } = get(); const s = {}; for (const [id, b] of Object.entries(boards)) s[id] = { nodes: (b.nodes || []).map(persistNode), pins: b.pins, viewport: b.viewport, name: b.name, history: b.history ? { ...b.history, past: (b.history.past || []).map(persistSnapshot), future: (b.history.future || []).map(persistSnapshot) } : b.history }; try { localStorage.setItem('wb_boards_v6', JSON.stringify(s)); } catch { } }, 300); };
      const saveHistory = () => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board) return; const snap = { nodes: deepClone(board.nodes), pins: deepClone(board.pins) }; set({ boards: { ...boards, [currentBoardId]: { ...board, history: { past: [...board.history.past.slice(-100), snap], future: [] } } } }); scheduleSave(); };

      return {
        view: initialView,
        currentBoardId: initialBoardId || 'default',
        boards: saved,
        selectedNodeIds: [],
        tool: 'select',
        clipboard: null,
        dragging: null,
        showMinimap: true,
        pinPanelOpen: false,
        editingNodeId: null,
        shapePreview: null,
        deleteDialogTarget: null,
        resizing: null,

        setView: (v) => set({ view: v }),
        saveHistory,
        setCurrentBoardId: (id) => {
          const { boards } = get();
          if (!boards[id]) {
            set(s => ({ boards: { ...s.boards, [id]: { nodes: [], pins: [], viewport: { x: 0, y: 0, zoom: 1 }, history: { past: [], future: [] }, name: id } }, currentBoardId: id, selectedNodeIds: [], tool: 'select', view: 'canvas' }));
          } else {
            set({ currentBoardId: id, selectedNodeIds: [], tool: 'select', view: 'canvas' });
          }
          setBoardIdToHash(id);
          scheduleSave();
        },
        createBoard: (name) => {
          const id = name || `画布_${Date.now()}`;
          const { boards } = get();
          const finalId = boards[id] ? `${id}_${Date.now()}` : id;
          set(s => ({ boards: { ...s.boards, [finalId]: { nodes: [], pins: [], viewport: { x: 0, y: 0, zoom: 1 }, history: { past: [], future: [] }, name: finalId } }, currentBoardId: finalId, selectedNodeIds: [], tool: 'select', view: 'canvas' }));
          setBoardIdToHash(finalId);
          scheduleSave();
        },
        deleteBoard: (id) => {
          const { boards, currentBoardId } = get();
          const keys = Object.keys(boards);
          if (keys.length <= 1) return;
          const newBoards = { ...boards }; delete newBoards[id];
          const newId = id === currentBoardId ? (keys.find(k => k !== id) || 'default') : currentBoardId;
          set({ boards: newBoards, currentBoardId: newId, selectedNodeIds: [], deleteDialogTarget: null });
          if (id === currentBoardId) setBoardIdToHash(newId);
          scheduleSave();
        },
        setDeleteDialogTarget: (id) => set({ deleteDialogTarget: id }),
        clearDeleteDialogTarget: () => set({ deleteDialogTarget: null }),
        goBackToList: () => { clearHash(); set({ view: 'board-list', selectedNodeIds: [], tool: 'select', editingNodeId: null }); },
        setTool: (tool) => set({ tool, selectedNodeIds: tool !== 'select' ? [] : get().selectedNodeIds }),
        selectNode: (id) => { if (get().tool === 'select') set({ selectedNodeIds: [id], editingNodeId: null }); },
        setSelectedNodes: (ids) => set({ selectedNodeIds: ids, editingNodeId: null }),
        deselectAll: () => set({ selectedNodeIds: [], editingNodeId: null }),
        startEditingNode: (id) => set({ editingNodeId: id }),
        stopEditingNode: () => {
          const { editingNodeId, boards, currentBoardId } = get();
          if (!editingNodeId) return;
          const board = boards[currentBoardId];
          if (board) {
            const snap = { nodes: deepClone(board.nodes), pins: deepClone(board.pins) };
            set({ editingNodeId: null, boards: { ...boards, [currentBoardId]: { ...board, history: { ...board.history, past: [...board.history.past.slice(-100), snap], future: [] } } } });
            scheduleSave();
          } else set({ editingNodeId: null });
        },
        setViewport: (vp) => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, viewport: { ...board.viewport, ...vp } } } }); scheduleSave(); } },
        zoomAt: (sx, sy, delta) => {
          const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board) return;
          const vp = board.viewport; const factor = delta > 0 ? 1.1 : 1 / 1.1; const nz = Math.max(0.06, Math.min(8, vp.zoom * factor));
          const wx = (sx - vp.x) / vp.zoom, wy = (sy - vp.y) / vp.zoom;
          set({ boards: { ...boards, [currentBoardId]: { ...board, viewport: { x: sx - wx * nz, y: sy - wy * nz, zoom: nz } } } });
          scheduleSave();
        },
        addNode: (node) => { saveHistory(); const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: [...board.nodes, node] } }, selectedNodeIds: [node.id] }); scheduleSave(); } },
        addNodes: (newNodes) => { if (!newNodes.length) return; saveHistory(); const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: [...board.nodes, ...newNodes] } }, selectedNodeIds: newNodes.map(n => n.id) }); scheduleSave(); } },
        updateNode: (id, updates) => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: board.nodes.map(n => n.id === id ? { ...n, ...updates } : n) } } }); scheduleSave(); } },
        deleteNode: (id) => get().deleteNodes([id]),
        deleteNodes: (ids) => {
          const idSet = new Set(ids);
          if (!idSet.size) return;
          saveHistory();
          const { boards, currentBoardId } = get();
          const board = boards[currentBoardId];
          if (!board) return;
          const remaining = board.nodes.filter(n => !idSet.has(n.id));
          const remainingImageIds = new Set(remaining.filter(n => n.type === 'image' && n.imageId).map(n => n.imageId));
          [...new Set(board.nodes.filter(n => idSet.has(n.id) && n.type === 'image' && n.imageId).map(n => n.imageId))]
            .filter(imageId => !remainingImageIds.has(imageId))
            .forEach(imageId => deleteImageFromDB(imageId).catch(console.error));
          set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: remaining } }, selectedNodeIds: [] });

        },
        updateNodesBatch: (map) => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: board.nodes.map(n => map.has(n.id) ? { ...n, ...map.get(n.id) } : n) } } }); scheduleSave(); } },
        addPin: (pin) => { saveHistory(); const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, pins: [...board.pins, pin] } } }); scheduleSave(); } },
        updatePin: (id, updates) => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, pins: board.pins.map(p => p.id === id ? { ...p, ...updates } : p) } } }); scheduleSave(); } },
        deletePin: (id) => { saveHistory(); const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (board) { set({ boards: { ...boards, [currentBoardId]: { ...board, pins: board.pins.filter(p => p.id !== id) } } }); scheduleSave(); } },
        goToPin: (id) => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board) return; const pin = board.pins.find(p => p.id === id); if (!pin) return; const vp = board.viewport; const sw = window.innerWidth, sh = window.innerHeight; set({ boards: { ...boards, [currentBoardId]: { ...board, viewport: { ...vp, x: sw / 2 - pin.x * vp.zoom, y: sh / 2 - pin.y * vp.zoom } } }, pinPanelOpen: false });
          scheduleSave();
        },
        setPinPanelOpen: (v) => set({ pinPanelOpen: v }),
        undo: () => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board || !board.history.past.length) return; const past = [...board.history.past]; const snap = past.pop(); const futureSnap = { nodes: deepClone(board.nodes), pins: deepClone(board.pins) }; set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: snap.nodes, pins: snap.pins, history: { past, future: [futureSnap, ...board.history.future.slice(0, 100)] } } }, selectedNodeIds: [] }); scheduleSave(); },
        redo: () => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board || !board.history.future.length) return; const future = [...board.history.future]; const snap = future.shift(); const pastSnap = { nodes: deepClone(board.nodes), pins: deepClone(board.pins) }; set({ boards: { ...boards, [currentBoardId]: { ...board, nodes: snap.nodes, pins: snap.pins, history: { past: [...board.history.past.slice(-100), pastSnap], future } } }, selectedNodeIds: [] }); scheduleSave(); },
        exportBoard: async () => { const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board) return; const nodes = await Promise.all(board.nodes.map(async n => { if (n.type === 'image' && n.imageId) { const blob = await getImageFromDB(n.imageId); if (blob) { const b64 = await blobToBase64(blob); return { ...n, src: b64 }; } } return n; })); const data = { nodes, pins: board.pins, viewport: board.viewport, name: board.name, version: '3.0' }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `whiteboard_${board.name || currentBoardId}.json`; a.click(); URL.revokeObjectURL(a.href); },
        importBoard: async (json) => { try { const data = typeof json === 'string' ? JSON.parse(json) : json; if (!data.nodes?.length) throw new Error('无效'); saveHistory(); const { boards, currentBoardId } = get(); const board = boards[currentBoardId]; if (!board) return false; const nodes = await Promise.all(data.nodes.map(async n => { if (n.type === 'image' && n.src?.startsWith('data:')) { const blob = base64ToBlob(n.src); const cb = await compressImageToWebP(blob); const imgId = n.imageId || genId(); await saveImageToDB(imgId, cb); return { ...n, src: URL.createObjectURL(cb), imageId: imgId }; } return n; })); set({ boards: { ...boards, [currentBoardId]: { ...board, nodes, pins: data.pins || [], viewport: data.viewport || { x: 0, y: 0, zoom: 1 }, history: { past: [], future: [] } } }, selectedNodeIds: [] }); scheduleSave(); return true; } catch (e) { console.error(e); return false; } },
        copySelectedNodes: () => { const { selectedNodeIds, boards, currentBoardId } = get(); if (!selectedNodeIds.length) return; const nodes = boards[currentBoardId]?.nodes.filter(n => selectedNodeIds.includes(n.id)); if (nodes?.length) set({ clipboard: nodes.map(deepClone) }); },
        pasteNodes: async (wx, wy) => {
          const { clipboard } = get(); if (!clipboard?.length) return;
          const ref = clipboard[0]; const refCx = ref.x + (ref.width || 100) / 2, refCy = ref.y + (ref.height || 30) / 2; const dx = wx - refCx, dy = wy - refCy;
          const newNodes = await Promise.all(clipboard.map(async n => {
            const nn = { ...deepClone(n), id: genId(), x: n.x + dx, y: n.y + dy };
            if (nn.type === 'line' || nn.type === 'arrow') { nn.x2 = (n.x2 ?? n.x + (n.width || 0)) + dx; nn.y2 = (n.y2 ?? n.y + (n.height || 0)) + dy; }
            if (nn.type === 'image' && nn.imageId) {
              const blob = await getNodeImageBlob(n);
              if (blob) {
                const imageId = genId();

        startDrag: (type, data) => set({ dragging: { type, ...data } }),
        updateDrag: (upd) => set(s => s.dragging ? { dragging: { ...s.dragging, ...upd } } : {}),
        endDrag: () => {
          const { dragging, boards, currentBoardId } = get();
          if (!dragging) return;
          if (dragging.type === 'marquee' && dragging.endWorldX !== undefined) {
            const board = boards[currentBoardId];
            if (board) {
              const x = Math.min(dragging.startWorldX, dragging.endWorldX), y = Math.min(dragging.startWorldY, dragging.endWorldY);
              const w = Math.abs(dragging.endWorldX - dragging.startWorldX), h = Math.abs(dragging.endWorldY - dragging.startWorldY);
              const ids = board.nodes.filter(n => {
                const b = getNodeBounds(n);
                return b.x < x + w && b.x + b.width > x && b.y < y + h && b.y + b.height > y;
              }).map(n => n.id);
              const base = dragging.additive ? get().selectedNodeIds : [];
              set({ dragging: null, shapePreview: null, selectedNodeIds: [...new Set([...base, ...ids])], editingNodeId: null });
            } else set({ dragging: null, shapePreview: null });
            return;
          }
          if ((dragging.type === 'node' && dragging.nodeId && dragging.didMove) || (dragging.type === 'multi' && dragging.originals?.length && dragging.didMove)) {
            const board = boards[currentBoardId];
            if (board) {
              const snap = dragging.startSnapshot || { nodes: deepClone(board.nodes), pins: deepClone(board.pins) };
              set({ dragging: null, boards: { ...boards, [currentBoardId]: { ...board, history: { ...board.history, past: [...board.history.past.slice(-100), snap], future: [] } } } });
              scheduleSave();
              return;
            }
          }
          if (dragging.type === 'pin' && dragging.pinId && dragging.didMove) {
            const board = boards[currentBoardId];
            if (board) {
              const snap = dragging.startSnapshot || { nodes: deepClone(board.nodes), pins: deepClone(board.pins) };
              set({ dragging: null, boards: { ...boards, [currentBoardId]: { ...board, history: { ...board.history, past: [...board.history.past.slice(-100), snap], future: [] } } } });
              scheduleSave();
              return;
            }
          }
          if (dragging.type === 'shape' && dragging.endWorldX !== undefined) {
            const { shapeType, startWorldX, startWorldY, endWorldX, endWorldY } = dragging;
            const node = { id: genId(), type: shapeType, x: startWorldX, y: startWorldY, x2: endWorldX, y2: endWorldY, width: Math.abs(endWorldX - startWorldX), height: Math.abs(endWorldY - startWorldY), color: shapeType === 'rectangle' ? 'rgba(255,255,255,0.25)' : '#f472b6' };
            if (shapeType === 'rectangle') { node.x = Math.min(startWorldX, endWorldX); node.y = Math.min(startWorldY, endWorldY); }

            get().addNode(node);

          }
          set({ dragging: null, shapePreview: null });
        },
        setShapePreview: (p) => set({ shapePreview: p }),
        setShowMinimap: (v) => set({ showMinimap: v }),
        startResizing: (nodeId, handle, startPos, nodePos, nodeDim) => {
          const { boards, currentBoardId } = get();
          const board = boards[currentBoardId];
          set({
            resizing: { nodeId, handle, startMouseX: startPos.x, startMouseY: startPos.y, startX: nodePos.x, startY: nodePos.y, startWidth: nodeDim.width, startHeight: nodeDim.height, aspectRatio: nodeDim.aspectRatio, historySnapshot: board ? deepClone({ nodes: board.nodes, pins: board.pins }) : null }
          });
        },
        updateResizing: (mouseX, mouseY, maintainRatio) => {
          const { resizing, boards, currentBoardId } = get();
          if (!resizing) return;
          const board = boards[currentBoardId];
          if (!board) return;
          const vpZoom = board.viewport.zoom || 1;
          const { nodeId, handle, startMouseX, startMouseY, startX, startY, startWidth, startHeight, aspectRatio } = resizing;
          const dx = (mouseX - startMouseX) / vpZoom;
          const dy = (mouseY - startMouseY) / vpZoom;
          let newX = startX, newY = startY, newW = startWidth, newH = startHeight;
          const effectiveRatio = maintainRatio && aspectRatio ? aspectRatio : null;

          const applyRatio = (tw, th) => {
            if (!effectiveRatio) return { w: tw, h: th };
            if (tw / th > effectiveRatio) return { w: th * effectiveRatio, h: th };
            else return { w: tw, h: tw / effectiveRatio };
          };

          switch (handle) {
            case 'nw': { const d = applyRatio(startWidth - dx, startHeight - dy); newW = Math.max(10, d.w); newH = Math.max(10, d.h); newX = startX + startWidth - newW; newY = startY + startHeight - newH; break; }
            case 'ne': { const d = applyRatio(startWidth + dx, startHeight - dy); newW = Math.max(10, d.w); newH = Math.max(10, d.h); newY = startY + startHeight - newH; break; }
            case 'sw': { const d = applyRatio(startWidth - dx, startHeight + dy); newW = Math.max(10, d.w); newH = Math.max(10, d.h); newX = startX + startWidth - newW; break; }
            case 'se': { const d = applyRatio(startWidth + dx, startHeight + dy); newW = Math.max(10, d.w); newH = Math.max(10, d.h); break; }
            case 'n': { const d = effectiveRatio ? { w: startHeight - dy * effectiveRatio, h: startHeight - dy } : { w: startWidth, h: startHeight - dy }; newH = Math.max(10, d.h); newW = effectiveRatio ? Math.max(10, d.w) : startWidth; if (effectiveRatio) newX = startX + (startWidth - newW) / 2; newY = startY + startHeight - newH; break; }
            case 's': { const d = effectiveRatio ? { w: startHeight + dy * effectiveRatio, h: startHeight + dy } : { w: startWidth, h: startHeight + dy }; newH = Math.max(10, d.h); newW = effectiveRatio ? Math.max(10, d.w) : startWidth; if (effectiveRatio) newX = startX + (startWidth - newW) / 2; break; }
            case 'w': { const d = effectiveRatio ? { w: startWidth - dx, h: (startWidth - dx) / effectiveRatio } : { w: startWidth - dx, h: startHeight }; newW = Math.max(10, d.w); newH = effectiveRatio ? Math.max(10, d.h) : startHeight; if (effectiveRatio) newY = startY + (startHeight - newH) / 2; newX = startX + startWidth - newW; break; }
            case 'e': { const d = effectiveRatio ? { w: startWidth + dx, h: (startWidth + dx) / effectiveRatio } : { w: startWidth + dx, h: startHeight }; newW = Math.max(10, d.w); newH = effectiveRatio ? Math.max(10, d.h) : startHeight; if (effectiveRatio) newY = startY + (startHeight - newH) / 2; break; }
          }
          const nodes = board.nodes.map(n => n.id === nodeId ? { ...n, x: newX, y: newY, width: newW, height: newH } : n);
          set({ boards: { ...boards, [currentBoardId]: { ...board, nodes } } });
        },
        endResizing: () => {
          const { resizing, boards, currentBoardId } = get();
          if (!resizing) return;
          const board = boards[currentBoardId];
          if (board) {
            const snap = resizing.historySnapshot || { nodes: deepClone(board.nodes), pins: deepClone(board.pins) };

          } else set({ resizing: null });
        },
      };
    });

function useImageLoader() {
      const updateNode = useStore(s => s.updateNode);
      React.useEffect(() => {
        let cancelled = false;
        (async () => {
          const boards = useStore.getState().boards;
          for (const [, board] of Object.entries(boards)) {
            for (const node of board.nodes) {
              if (cancelled) return;
              if (node.type === 'image' && node.imageId && (!node.src || node.src === '' || node.src === 'undefined')) {
                try { const blob = await getImageFromDB(node.imageId); if (blob && !cancelled) updateNode(node.id, { src: URL.createObjectURL(blob) }); } catch { }
              }
            }
          }
        })();
        return () => { cancelled = true; };
      }, []);
    }

    function ToolbarButton({ children, onClick, disabled, title, active, activeColor }) {
      return (
        <Tooltip.Root delayDuration={400}>
          <Tooltip.Trigger asChild>
            <button onClick={onClick} disabled={disabled} className="p-1.5 rounded transition-all flex items-center justify-center" style={{ color: disabled ? '#4a4a4a' : active ? (activeColor || '#007acc') : '#858585', background: active ? '#007acc' : 'transparent', cursor: disabled ? 'not-allowed' : 'pointer' }} onMouseEnter={e => { if (!active && !disabled) e.currentTarget.style.background = '#3c3c3c'; }} onMouseLeave={e => { if (!active && !disabled) e.currentTarget.style.background = 'transparent'; }}>
              {children}
            </button>
          </Tooltip.Trigger>
          {title && <Tooltip.Portal><Tooltip.Content className="px-2 py-1 text-xs rounded shadow border" style={{ background: '#333', color: '#ddd', borderColor: '#555' }} sideOffset={6}>{title}<Tooltip.Arrow style={{ fill: '#333' }} /></Tooltip.Content></Tooltip.Portal>}
        </Tooltip.Root>
      );
    }

    function ResizeHandles({ nodeId }) {
      const startResizing = useStore(s => s.startResizing);
      const nodes = useStore(s => s.boards[s.currentBoardId]?.nodes || []);
      const node = nodes.find(n => n.id === nodeId);
      if (!node || node.type === 'line' || node.type === 'arrow') return null;
      const handles = node.type === 'image' ? ['nw', 'ne', 'se', 'sw'] : ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
      const getStyle = (h) => {
        const base = { position: 'absolute', width: 10, height: 10, background: '#007acc', border: '1px solid white', borderRadius: 1, zIndex: 20 };
        switch (h) {
          case 'nw': return { ...base, top: -5, left: -5, cursor: 'nwse-resize' };
          case 'n': return { ...base, top: -5, left: '50%', marginLeft: -5, cursor: 'ns-resize' };
          case 'ne': return { ...base, top: -5, right: -5, cursor: 'nesw-resize' };
          case 'e': return { ...base, top: '50%', marginTop: -5, right: -5, cursor: 'ew-resize' };
          case 'se': return { ...base, bottom: -5, right: -5, cursor: 'nwse-resize' };
          case 's': return { ...base, bottom: -5, left: '50%', marginLeft: -5, cursor: 'ns-resize' };
          case 'sw': return { ...base, bottom: -5, left: -5, cursor: 'nesw-resize' };
          case 'w': return { ...base, top: '50%', marginTop: -5, left: -5, cursor: 'ew-resize' };
        }
      };
      return handles.map(h => (
        <div key={h} className="resize-handle" style={getStyle(h)} onMouseDown={e => {
          e.stopPropagation(); e.preventDefault();
          const n = nodes.find(n => n.id === nodeId);
          if (n) {
            const ratio = n.type === 'image' ? (n.width / n.height) : undefined;
            startResizing(nodeId, h, { x: e.clientX, y: e.clientY }, { x: n.x, y: n.y }, { width: n.width, height: n.height, aspectRatio: ratio });
          }
        }} />
      ));
    }

    function TextNode({ node, isSelected, isEditing, onNodeMouseDown, onNodeDoubleClick }) {
      const updateNode = useStore(s => s.updateNode);
      const stopEditingNode = useStore(s => s.stopEditingNode);
      const ref = React.useRef(null);
      React.useEffect(() => { if (isEditing && ref.current) { const el = ref.current; setTimeout(() => { el.focus(); const sel = window.getSelection(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }, 10); } }, [isEditing]);
      const base = { position: 'absolute', left: 0, top: 0, minWidth: 50, cursor: isSelected && !isEditing ? 'move' : isEditing ? 'text' : 'pointer', userSelect: 'none' };
      if (isEditing) return <div ref={ref} contentEditable suppressContentEditableWarning className="px-2.5 py-2 text-sm rounded-md min-w-[60px] outline-none text-node-editing" style={{ ...base, width: node.width || 220, background: 'rgba(30,30,35,0.92)', border: '1px solid rgba(255,255,255,0.1)', color: '#d0d0d0', whiteSpace: 'pre-wrap', wordBreak: 'break-word', fontSize: 13, lineHeight: 1.5 }} onMouseDown={e => e.stopPropagation()} onBlur={() => { const c = ref.current?.innerText || ''; updateNode(node.id, { content: c || '双击编辑' }); stopEditingNode(); }}>{node.content || ''}</div>;
      return <div className={`px-2.5 py-2 text-sm rounded-md min-w-[60px] markdown-rendered ${isSelected ? 'node-selected' : ''}`} style={{ ...base, width: node.width || 220, background: 'rgba(30,30,35,0.85)', border: '1px solid rgba(255,255,255,0.07)', color: '#d0d0d0', fontSize: 13, lineHeight: 1.5 }} onMouseDown={e => onNodeMouseDown(node.id, e)} onDoubleClick={e => { e.stopPropagation(); onNodeDoubleClick(node.id); }} dangerouslySetInnerHTML={{ __html: renderMarkdownSafe(node.content || '双击编辑') }} />;
    }

    function ImageNode({ node, isSelected, onNodeMouseDown }) {
      return <div className={`${isSelected ? 'node-selected' : ''} rounded-lg overflow-hidden`} style={{ position: 'absolute', left: 0, top: 0, width: node.width || 200, height: node.height || 150, background: '#1e1e1e', cursor: isSelected ? 'move' : 'pointer', userSelect: 'none' }} onMouseDown={e => onNodeMouseDown(node.id, e)}><img src={node.src} alt="" className="w-full h-full object-contain" draggable={false} style={{ pointerEvents: 'none' }} /></div>;
    }

    function IframeNode({ node, isSelected, onNodeMouseDown, onNodeDoubleClick }) {
      return <div className={`${isSelected ? 'node-selected' : ''} rounded-lg overflow-hidden border`} style={{ position: 'absolute', left: 0, top: 0, width: node.width || 400, height: node.height || 280, minWidth: 180, minHeight: 120, borderColor: '#3e3e3e', background: '#1e1e1e', cursor: isSelected ? 'move' : 'pointer', userSelect: 'none' }} onMouseDown={e => onNodeMouseDown(node.id, e)} onDoubleClick={e => { e.stopPropagation(); onNodeDoubleClick(node.id); }}>
        <div className="absolute top-0 left-0 right-0 px-2 py-1 text-xs truncate z-10 pointer-events-none" style={{ background: 'rgba(30,30,35,0.9)', color: '#858585' }}>🌐 {node.url || '双击设置URL'}</div>
        {node.url ? <iframe src={node.url} className="w-full h-full border-none" style={{ paddingTop: 20 }} sandbox="allow-scripts allow-same-origin" /> : <div className="flex items-center justify-center h-full text-sm pt-4" style={{ color: '#858585' }}>双击设置URL</div>}
      </div>;
    }

    function RectangleNode({ node, isSelected, onNodeMouseDown, onNodeDoubleClick }) {
      return <div className={`group-node ${isSelected ? 'node-selected' : ''}`} style={{ position: 'absolute', left: 0, top: 0, width: node.width || 120, height: node.height || 90, minWidth: 20, minHeight: 20, cursor: isSelected ? 'move' : 'pointer', userSelect: 'none' }} onMouseDown={e => onNodeMouseDown(node.id, e)} onDoubleClick={e => { e.stopPropagation(); onNodeDoubleClick(node.id); }} />;
    }

    function LineNode({ node, isSelected, onNodeMouseDown }) {
      const x1 = node.x, y1 = node.y, x2 = node.x2 ?? node.x + (node.width || 0), y2 = node.y2 ?? node.y + (node.height || 0);
      const minX = Math.min(x1, x2), minY = Math.min(y1, y2);
      const svgW = Math.abs(x2 - x1) + 8, svgH = Math.abs(y2 - y1) + 8;
      const sx1 = x1 - minX + 4, sy1 = y1 - minY + 4, sx2 = x2 - minX + 4, sy2 = y2 - minY + 4;
      const color = node.color || '#f472b6';
      return <div className={isSelected ? 'node-selected' : ''} style={{ position: 'absolute', left: minX - 4, top: minY - 4, width: svgW, height: svgH, overflow: 'visible', cursor: isSelected ? 'move' : 'pointer', userSelect: 'none' }} onMouseDown={e => onNodeMouseDown(node.id, e)}>
        <svg width={svgW} height={svgH} style={{ overflow: 'visible', pointerEvents: 'none' }}>
          {node.type === 'arrow' && <defs><marker id={`ah_${node.id}`} markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill={color} /></marker></defs>}
          <line x1={sx1} y1={sy1} x2={sx2} y2={sy2} stroke={color} strokeWidth="2" strokeLinecap="round" markerEnd={node.type === 'arrow' ? `url(#ah_${node.id})` : undefined} />
        </svg>
      </div>;
    }

    function NodeRenderer({ node, isSelected, isEditing, showResizeHandles, onNodeMouseDown, onNodeDoubleClick }) {
      const Wrapper = ({ children }) => <div style={{ position: 'relative', width: '100%', height: '100%' }}>{children}{isSelected && showResizeHandles && <ResizeHandles nodeId={node.id} />}</div>;
      switch (node.type) {
        case 'text': return <Wrapper><TextNode node={node} isSelected={isSelected} isEditing={isEditing} onNodeMouseDown={onNodeMouseDown} onNodeDoubleClick={onNodeDoubleClick} /></Wrapper>;
        case 'image': return <Wrapper><ImageNode node={node} isSelected={isSelected} onNodeMouseDown={onNodeMouseDown} /></Wrapper>;
        case 'iframe': return <Wrapper><IframeNode node={node} isSelected={isSelected} onNodeMouseDown={onNodeMouseDown} onNodeDoubleClick={onNodeDoubleClick} /></Wrapper>;
        case 'rectangle': return <Wrapper><RectangleNode node={node} isSelected={isSelected} onNodeMouseDown={onNodeMouseDown} onNodeDoubleClick={onNodeDoubleClick} /></Wrapper>;
        case 'line': case 'arrow': return <LineNode node={node} isSelected={isSelected} onNodeMouseDown={onNodeMouseDown} />;
        default: return null;
      }
    }

    function PinMarker({ pin, tool, onMouseDown }) {
      return <div data-pin-id={pin.id} style={{ position: 'absolute', left: pin.x - 8, top: pin.y - 18, cursor: tool === 'select' ? 'move' : 'pointer', zIndex: 50 }} title={pin.label || '图钉'} onMouseDown={onMouseDown}>
        <div className="flex flex-col items-center pointer-events-none">
          <div className="w-3.5 h-3.5 rounded-full shadow-lg border-2" style={{ background: '#d4a72c', borderColor: 'rgba(255,255,255,0.7)', boxShadow: '0 0 8px rgba(212,167,44,0.4)' }} />
          <div className="w-0.5 h-4" style={{ background: 'rgba(212,167,44,0.6)' }} />
        </div>
      </div>;
    }

    function Minimap() {
      const show = useStore(s => s.showMinimap);
      const boards = useStore(s => s.boards);
      const currentBoardId = useStore(s => s.currentBoardId);
      const setViewport = useStore(s => s.setViewport);
      const board = boards[currentBoardId];
      const nodes = board?.nodes || [], pins = board?.pins || [], vp = board?.viewport || { x: 0, y: 0, zoom: 1 };
      if (!show) return null;
      const mmW = 180, mmH = 120;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      nodes.forEach(n => { const nx = n.x, ny = n.y, nw = n.width || 60, nh = n.height || 30; minX = Math.min(minX, nx); minY = Math.min(minY, ny); maxX = Math.max(maxX, nx + nw); maxY = Math.max(maxY, ny + nh); if (n.type === 'line' || n.type === 'arrow') { const ex = n.x2 !== undefined ? n.x2 : nx + nw, ey = n.y2 !== undefined ? n.y2 : ny + nh; minX = Math.min(minX, ex); minY = Math.min(minY, ey); maxX = Math.max(maxX, ex); maxY = Math.max(maxY, ey); } });
      pins.forEach(p => { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
      if (!isFinite(minX)) { minX = -400; minY = -400; maxX = 400; maxY = 400; }
      const padX = (maxX - minX) * 0.4 + 80, padY = (maxY - minY) * 0.4 + 80;
      const scale = Math.min(mmW / (maxX - minX + padX * 2), mmH / (maxY - minY + padY * 2));
      const offX = (mmW - (maxX - minX + padX * 2) * scale) / 2, offY = (mmH - (maxY - minY + padY * 2) * scale) / 2;
      const toMM = (wx, wy) => ({ mx: offX + (wx - minX + padX) * scale, my: offY + (wy - minY + padY) * scale });
      const sw = window.innerWidth, sh = window.innerHeight;
      const vpL = -vp.x / vp.zoom, vpT = -vp.y / vp.zoom;
      const vpTL = toMM(vpL, vpT), vpBR = toMM(vpL + sw / vp.zoom, vpT + sh / vp.zoom);
      return <div className="fixed bottom-3 right-3 z-40 rounded-lg border shadow-lg overflow-hidden cursor-pointer" style={{ background: '#252526', borderColor: '#3e3e3e', width: mmW + 10, height: mmH + 28 }} onClick={e => { const r = e.currentTarget.getBoundingClientRect(); const cx = e.clientX - r.left - 5, cy = e.clientY - r.top - 18; const wx = minX - padX + (cx - offX) / scale, wy = minY - padY + (cy - offY) / scale; setViewport({ x: sw / 2 - wx * vp.zoom, y: sh / 2 - wy * vp.zoom }); }}>
        <div className="text-xs text-center pt-1 font-medium" style={{ color: '#858585' }}>小地图</div>
        <div className="relative mx-1 mt-0.5 rounded" style={{ width: mmW, height: mmH, background: '#1a1a1a' }}>
          {nodes.map(n => { const tl = toMM(n.x, n.y), br = toMM(n.x + (n.width || 60), n.y + (n.height || 30)); let c = 'rgba(148,163,184,0.5)'; if (n.type === 'image') c = 'rgba(96,165,250,0.6)'; if (n.type === 'iframe') c = 'rgba(167,139,250,0.6)'; if (n.type === 'text') c = 'rgba(251,191,36,0.55)'; if (n.type === 'rectangle') c = 'rgba(255,255,255,0.2)'; if (n.type === 'line' || n.type === 'arrow') c = 'rgba(244,114,182,0.5)'; return <div key={n.id} className="minimap-dot" style={{ left: tl.mx, top: tl.my, width: Math.max(br.mx - tl.mx, 2), height: Math.max(br.my - tl.my, 2), backgroundColor: c }} />; })}
          {pins.map(p => { const pm = toMM(p.x, p.y); return <div key={p.id} className="minimap-pin" style={{ left: pm.mx, top: pm.my }} />; })}
          <div className="absolute border rounded-sm pointer-events-none" style={{ left: Math.max(0, vpTL.mx), top: Math.max(0, vpTL.my), width: Math.min(vpBR.mx - vpTL.mx, mmW), height: Math.min(vpBR.my - vpTL.my, mmH), borderColor: '#007acc' }} />
        </div>
      </div>;
    }

      const [contextMenu, setContextMenu] = React.useState(null);
      const sortedNodes = React.useMemo(() => { const rects = nodes.filter(n => n.type === 'rectangle'); return [...rects, ...nodes.filter(n => n.type !== 'rectangle')]; }, [nodes]);
      const screenToWorld = React.useCallback((sx, sy) => { const r = canvasRef.current?.getBoundingClientRect(); return { wx: ((r ? sx - r.left : sx) - vp.x) / vp.zoom, wy: ((r ? sy - r.top : sy) - vp.y) / vp.zoom }; }, [vp.x, vp.y, vp.zoom]);
      const isNodeInsideRect = (node, rect) => { if (node.type === 'rectangle') return false; const cx = node.x + (node.width || 60) / 2, cy = node.y + (node.height || 30) / 2; return cx >= rect.x && cx <= rect.x + (rect.width || 120) && cy >= rect.y && cy <= rect.y + (rect.height || 90); };

      const beginNodeDrag = React.useCallback((nodeId, e) => {
        if (tool !== 'select' || editingNodeId) return false;
        const node = nodes.find(n => n.id === nodeId);
        if (!node) return false;
        const currentIds = useStore.getState().selectedNodeIds;
        let nextIds = currentIds;
        if (!currentIds.includes(nodeId)) nextIds = (e.ctrlKey || e.metaKey) ? [...currentIds, nodeId] : [nodeId];
        if (nextIds !== currentIds) setSelectedNodes(nextIds);
        const { wx, wy } = screenToWorld(e.clientX, e.clientY);
        const originals = nextIds.map(id => { const n = nodes.find(nn => nn.id === id); return n ? { id, x: n.x, y: n.y, x2: n.x2, y2: n.y2 } : null; }).filter(Boolean);
        if (node.type === 'rectangle') {
          nodes.filter(n => n.id !== nodeId && isNodeInsideRect(n, node) && !nextIds.includes(n.id)).forEach(n => originals.push({ id: n.id, x: n.x, y: n.y, x2: n.x2, y2: n.y2 }));
        }
        startDrag('multi', { originals, startWx: wx, startWy: wy, didMove: false, startSnapshot: deepClone({ nodes, pins }) });
        return true;
      }, [tool, editingNodeId, nodes, pins, screenToWorld]);

      const handleDragOver = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; };
      const handleDrop = async e => {
        e.preventDefault();
        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
        if (!files.length) return;
        const { wx, wy } = screenToWorld(e.clientX, e.clientY);
        for (const file of files) {
          try { await addImageNodeFromBlob(file, wx, wy); } catch (err) { console.error(err); }
        }
      };

      const handleMouseDown = React.useCallback(e => {
        if (e.button !== 0) return;
        if (resizing) { endResizing(); return; }
        const pinEl = e.target.closest('[data-pin-id]');
        if (pinEl) {
          e.stopPropagation();
          const pinId = pinEl.getAttribute('data-pin-id');
          const pin = pins.find(p => p.id === pinId);
          if (pin && tool === 'select') { const { wx, wy } = screenToWorld(e.clientX, e.clientY); startDrag('pin', { pinId, offsetX: wx - pin.x, offsetY: wy - pin.y, startX: pin.x, startY: pin.y, didMove: false, startSnapshot: deepClone({ nodes, pins }) }); return; }
        }
        if (e.target.closest('.resize-handle')) return;
        const { wx, wy } = screenToWorld(e.clientX, e.clientY);
        const targetNodeEl = e.target.closest('[data-node-id]');
        const nodeId = targetNodeEl?.getAttribute('data-node-id');
        if (tool === 'select') {
          if (nodeId && !editingNodeId) {
            beginNodeDrag(nodeId, e);
          } else if (!nodeId && !editingNodeId && (e.ctrlKey || e.metaKey)) {
            startDrag('marquee', { startWorldX: wx, startWorldY: wy, endWorldX: wx, endWorldY: wy, additive: true });
            setMarqueeRect({ x: wx, y: wy, width: 0, height: 0 });
          } else if (!nodeId && !editingNodeId) { deselectAll(); stopEditingNode(); startDrag('canvas', { startX: e.clientX, startY: e.clientY, vpX: vp.x, vpY: vp.y }); }
        } else if (tool === 'pin') {
          if (!nodeId && !pinEl) { const pid = genId(); addPin({ id: pid, x: wx, y: wy, label: `图钉 ${pins.length + 1}` }); setPinPanelOpen(true); }
        } else if (['rectangle', 'line', 'arrow'].includes(tool)) {
          if (!nodeId && !pinEl) { startDrag('shape', { shapeType: tool, startWorldX: wx, startWorldY: wy }); setShapePreview({ type: tool, x: wx, y: wy, w: 0, h: 0, startX: wx, startY: wy, endX: wx, endY: wy }); }
        }
      }, [tool, screenToWorld, nodes, pins, editingNodeId, resizing, beginNodeDrag]);

      const handleMouseMove = React.useCallback(e => {
        if (resizing) { const node = nodes.find(n => n.id === resizing.nodeId); updateResizing(e.clientX, e.clientY, node?.type === 'image' ? true : !e.shiftKey); return; }
        if (!dragging) return;
        if (dragging.type === 'canvas') setViewport({ x: dragging.vpX + e.clientX - dragging.startX, y: dragging.vpY + e.clientY - dragging.startY });
        else if (dragging.type === 'marquee') {
          const { wx, wy } = screenToWorld(e.clientX, e.clientY);
          const x = Math.min(dragging.startWorldX, wx), y = Math.min(dragging.startWorldY, wy);
          setMarqueeRect({ x, y, width: Math.abs(wx - dragging.startWorldX), height: Math.abs(wy - dragging.startWorldY) });
          updateDrag({ endWorldX: wx, endWorldY: wy, didMove: true });
        } else if (dragging.type === 'multi' && dragging.originals?.length) {
          const { wx, wy } = screenToWorld(e.clientX, e.clientY);
          const dx = wx - dragging.startWx, dy = wy - dragging.startWy;
          updateDrag({ didMove: Math.abs(dx) > 1 || Math.abs(dy) > 1 });
          const map = new Map();
          dragging.originals.forEach(o => {
            const n = nodes.find(nn => nn.id === o.id);
            if (!n) return;
            if (n.type === 'line' || n.type === 'arrow') map.set(o.id, { x: o.x + dx, y: o.y + dy, x2: (o.x2 ?? o.x + (n.width || 0)) + dx, y2: (o.y2 ?? o.y + (n.height || 0)) + dy });
            else map.set(o.id, { x: o.x + dx, y: o.y + dy });
          });
          if (map.size) updateNodesBatch(map);
        } else if (dragging.type === 'node' && dragging.nodeId) {
          const { wx, wy } = screenToWorld(e.clientX, e.clientY);
          const nx = wx - dragging.offsetX, ny = wy - dragging.offsetY;
          updateDrag({ didMove: Math.abs(nx - dragging.startX) > 1 || Math.abs(ny - dragging.startY) > 1 });
          const node = nodes.find(n => n.id === dragging.nodeId);
          if (node) {
            if (node.type === 'line' || node.type === 'arrow') { updateNode(dragging.nodeId, { x: nx, y: ny, x2: (node.x2 ?? node.x + (node.width || 0)) + (nx - node.x), y2: (node.y2 ?? node.y + (node.height || 0)) + (ny - node.y) }); }
            else updateNode(dragging.nodeId, { x: nx, y: ny });
            if (dragging.containedNodes?.length) {
              const rdx = nx - dragging.origRectX, rdy = ny - dragging.origRectY;
              const map = new Map();
              dragging.containedNodes.forEach(cn => map.set(cn.id, { x: cn.origX + rdx, y: cn.origY + rdy }));
              useStore.getState().updateNodesBatch(map);
            }
          }
        } else if (dragging.type === 'pin') { const { wx, wy } = screenToWorld(e.clientX, e.clientY); updatePin(dragging.pinId, { x: wx - dragging.offsetX, y: wy - dragging.offsetY }); updateDrag({ didMove: true }); }
        else if (dragging.type === 'shape') { const { wx, wy } = screenToWorld(e.clientX, e.clientY); setShapePreview({ type: dragging.shapeType, x: Math.min(dragging.startWorldX, wx), y: Math.min(dragging.startWorldY, wy), w: Math.abs(wx - dragging.startWorldX), h: Math.abs(wy - dragging.startWorldY), startX: dragging.startWorldX, startY: dragging.startWorldY, endX: wx, endY: wy }); updateDrag({ endWorldX: wx, endWorldY: wy }); }
      }, [dragging, resizing, nodes, screenToWorld, updateNodesBatch]);

      const handleMouseUp = React.useCallback(() => {
        setMarqueeRect(null);
        if (resizing) endResizing(); else if (dragging) endDrag();
      }, [dragging, resizing]);

      const handleDoubleClick = React.useCallback(e => {
        const targetNodeEl = e.target.closest('[data-node-id]');
        const nodeId = targetNodeEl?.getAttribute('data-node-id');
        if (nodeId) {
          const node = nodes.find(n => n.id === nodeId);
          if (!node) return;
          if (node.type === 'text') startEditingNode(nodeId);
          else if (node.type === 'iframe') { const u = prompt('iframe URL:', node.url || 'https://'); if (u !== null && u.trim()) updateNode(nodeId, { url: u.trim() }); }
          else if (node.type === 'rectangle') { const l = prompt('分组标签:', node.label || ''); if (l !== null) updateNode(nodeId, { label: l.trim() }); }
        } else if (tool === 'select') {
          const { wx, wy } = screenToWorld(e.clientX, e.clientY);
          const newNode = { id: genId(), type: 'text', x: wx - 80, y: wy - 20, width: 240, height: 40, content: '' };
          addNode(newNode);
          setTimeout(() => startEditingNode(newNode.id), 60);
        }
      }, [nodes, tool, screenToWorld]);

      const handleNodeMouseDown = React.useCallback((nodeId, e) => {
        e.stopPropagation();
        beginNodeDrag(nodeId, e);
      }, [beginNodeDrag]);

      const handleContextMenu = React.useCallback(e => {
        e.preventDefault();
        const el = e.target.closest('[data-node-id]');
        if (!el) { setContextMenu(null); return; }
        const nodeId = el.getAttribute('data-node-id');
        const node = nodes.find(n => n.id === nodeId);
        if (!node) return;
        const currentIds = useStore.getState().selectedNodeIds;
        let ids = currentIds.includes(nodeId) ? currentIds : [nodeId];
        if ((e.ctrlKey || e.metaKey) && !currentIds.includes(nodeId)) ids = [...currentIds, nodeId];
        if (!currentIds.includes(nodeId)) setSelectedNodes(ids);
        setContextMenu({
          x: Math.max(8, Math.min(e.clientX, window.innerWidth - 190)),
          y: Math.max(8, Math.min(e.clientY, window.innerHeight - 250)),
          nodeIds: ids
        });
      }, [nodes]);

      React.useEffect(() => {
        if (!contextMenu) return;
        const close = e => { if (!e.target.closest('.wb-context-menu')) setContextMenu(null); };
        const esc = e => { if (e.key === 'Escape') setContextMenu(null); };
        const wheel = () => setContextMenu(null);
        window.addEventListener('pointerdown', close, true);
        window.addEventListener('contextmenu', close, true);
        window.addEventListener('keydown', esc);
        window.addEventListener('wheel', wheel, { passive: true });
        return () => {
          window.removeEventListener('pointerdown', close, true);
          window.removeEventListener('contextmenu', close, true);
          window.removeEventListener('keydown', esc);
          window.removeEventListener('wheel', wheel);
        };
      }, [contextMenu]);

      const handleWheel = React.useCallback(e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1 : -1); }, [zoomAt]);

      const handlePaste = React.useCallback(async e => {
        if (document.activeElement?.contentEditable === 'true' || document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
        const items = e.clipboardData?.items;
        if (!items) return;
        const { wx, wy } = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
        let handled = false;
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            const blob = item.getAsFile();
            if (blob) {
              try {
                await addImageNodeFromBlob(blob, wx, wy);
                handled = true;
              } catch (err) { console.error(err); }
            }
          } else if (item.type === 'text/plain' && !handled) {
            item.getAsString(text => { if (text.trim()) addNode({ id: genId(), type: 'text', x: wx - 110, y: wy - 20, width: 260, height: 50, content: text.trim() }); });
            handled = true;
          }
        }
        if (handled) e.preventDefault();
      }, [screenToWorld, addNode]);

      React.useEffect(() => {
        const handler = e => {
          if (document.activeElement?.contentEditable === 'true' || document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
          const ctrl = e.ctrlKey || e.metaKey;
          if (e.key === 'Delete' || e.key === 'Backspace') { const ids = useStore.getState().selectedNodeIds; if (ids.length) { e.preventDefault(); deleteNodes(ids); } }
          else if (ctrl && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
          else if (ctrl && e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
          else if (ctrl && e.key === 'c') { e.preventDefault(); copySelectedNodes(); }
          else if (ctrl && e.key === 'v') { const { wx, wy } = screenToWorld(window.innerWidth / 2, window.innerHeight / 2); pasteNodes(wx, wy); }
          else if (e.key === 'v' && !ctrl) setTool('select');
          else if (e.key === 'r' && !ctrl) setTool('rectangle');
          else if (e.key === 'l' && !ctrl) setTool('line');
          else if (e.key === 'a' && !ctrl) setTool('arrow');
          else if (e.key === 'p' && !ctrl) setTool('pin');
          else if (e.key === 'Escape') { setContextMenu(null); deselectAll(); stopEditingNode(); setTool('select'); }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [screenToWorld, deleteNodes, copySelectedNodes, pasteNodes, undo, redo, setTool, deselectAll, stopEditingNode]);

      return (
        <div ref={canvasRef} className="dot-bg absolute inset-0" style={{ backgroundSize: `${22 * vp.zoom}px ${22 * vp.zoom}px`, backgroundPosition: `${vp.x}px ${vp.y}px`, cursor: tool === 'select' ? 'default' : 'crosshair' }} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} onDoubleClick={handleDoubleClick} onContextMenu={handleContextMenu} onWheel={handleWheel} onPaste={handlePaste} onDragOver={handleDragOver} onDrop={handleDrop} tabIndex={0}>
          <div style={{ position: 'absolute', left: 0, top: 0, transform: `translate(${vp.x}px,${vp.y}px) scale(${vp.zoom})`, transformOrigin: '0 0', width: 0, height: 0 }}>
            {sortedNodes.map(node => {
              const nb = getNodeBounds(node);
              return <div key={node.id} data-node-id={node.id} style={{ position: 'absolute', left: node.x, top: node.y, width: nb.width, height: nb.height, zIndex: node.type === 'rectangle' ? 1 : 10 }}><NodeRenderer node={node} isSelected={selectedNodeIds.includes(node.id)} showResizeHandles={selectedNodeIds.length === 1} isEditing={editingNodeId === node.id} onNodeMouseDown={handleNodeMouseDown} onNodeDoubleClick={nid => { const n = nodes.find(nn => nn.id === nid); if (n?.type === 'text') startEditingNode(nid); else if (n?.type === 'iframe') { const u = prompt('iframe URL:', n.url || 'https://'); if (u !== null && u.trim()) updateNode(nid, { url: u.trim() }); } }} /></div>;
            })}
            <ShapePreview preview={shapePreview} />
            {marqueeRect && <div style={{ position: 'absolute', left: marqueeRect.x, top: marqueeRect.y, width: marqueeRect.width, height: marqueeRect.height, border: '1px dashed #007acc', background: 'rgba(0,122,204,0.12)', pointerEvents: 'none', zIndex: 9998 }} />}
            {pins.map(pin => <PinMarker key={pin.id} pin={pin} tool={tool} onMouseDown={handleMouseDown} />)}
          </div>
          <StatusBar vp={vp} nodesCount={nodes.length} pinsCount={pins.length} />
          {contextMenu && <ContextMenu menu={contextMenu} onClose={() => setContextMenu(null)} />}
        </div>
      );
    }

    function CanvasView() {
      const goBackToList = useStore(s => s.goBackToList);
      const boards = useStore(s => s.boards);
      const currentBoardId = useStore(s => s.currentBoardId);
      const board = boards[currentBoardId];
      useImageLoader();
      return <div className="relative w-screen h-screen overflow-hidden" style={{ background: '#1a1a24' }}>
        <button onClick={goBackToList} className="fixed top-2 left-2 z-50 flex items-center gap-1 px-2 py-1.5 rounded-lg border text-xs cursor-pointer shadow-lg" style={{ background: '#252526', borderColor: '#3e3e3e', color: '#858585' }}><ChevronLeft size={14} /><span className="max-w-[120px] truncate">{board?.name || currentBoardId}</span></button>
        <Toolbar /><Canvas /><Minimap />
      </div>;
    }

function App() {
      const view = useStore(s => s.view);
      if (view === 'board-list') return <BoardListPage />;
      return <CanvasView />;
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
