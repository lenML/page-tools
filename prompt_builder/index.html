<!DOCTYPE html>
<html data-theme="vscode-dark">

<head>

  <style>
    :root {
      --vscode-bg: #1f1f1f;
      --vscode-sidebar: #252526;
      --vscode-panel: #2d2d2d;
      --vscode-input: #313131;
      --vscode-border: #3e3e3e;
      --vscode-border-light: #474747;
      --vscode-text: #cccccc;
      --vscode-text-secondary: #999999;
      --vscode-text-muted: #6a6a6a;
      --vscode-highlight: #37373d;
      --vscode-blue: #0078d4;
      --vscode-blue-hover: #1a8ad4;
      --vscode-accent: #569cd6;
      --vscode-green: #4ec9b0;
      --vscode-orange: #ce9178;
      --vscode-yellow: #dcdcaa;
      --vscode-red: #f44747;
      --vscode-topbar: #2d2d2d;
      --vscode-activity: #333333;
      --vscode-focus-ring: #007fd4;
      --vscode-scrollbar: #424242;
      --vscode-scrollbar-hover: #555555;
    }

    [data-theme="vscode-dark"] {
      --color-base-100: oklch(0.18 0 0);
      --color-base-200: oklch(0.21 0 0);
      --color-base-300: oklch(0.26 0 0);
      --color-base-content: oklch(0.82 0 0);
      --color-primary: oklch(0.55 0.18 255);
      --color-primary-content: oklch(0.98 0 0);
      --color-secondary: oklch(0.6 0.12 180);
      --color-secondary-content: oklch(0.98 0 0);
      --color-accent: oklch(0.6 0.15 220);
      --color-accent-content: oklch(0.98 0 0);
      --color-neutral: oklch(0.25 0 0);
      --color-neutral-content: oklch(0.8 0 0);
      --color-info: oklch(0.6 0.12 220);
      --color-info-content: oklch(0.98 0 0);
      --color-success: oklch(0.6 0.12 160);
      --color-success-content: oklch(0.98 0 0);
      --color-warning: oklch(0.65 0.14 85);
      --color-warning-content: oklch(0.15 0 0);
      --color-error: oklch(0.5 0.18 20);
      --color-error-content: oklch(0.98 0 0);
      --radius-box: 0.375rem;
      --radius-btn: 0.25rem;
      --radius-field: 0.25rem;
      --radius-selector: 0.25rem;
      --border: 1px;
      --depth: 0;
      --noise: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--vscode-bg);
      color: var(--vscode-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--vscode-scrollbar);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--vscode-scrollbar-hover);
    }

    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    .font-mono {
      font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Monaco', 'Menlo', monospace;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-slide-in {
      animation: fadeSlideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .toast-animate {
      animation: toast-in 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slot-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(86, 156, 214, 0.35);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(86, 156, 214, 0);
      }
    }

    .slot-highlight {
      animation: slot-pulse 2.2s ease-in-out infinite;
    }

    .vscode-card {
      background: var(--vscode-panel);
      border: 1px solid var(--vscode-border);
      border-radius: 4px;
    }

    .vscode-card-header {
      border-bottom: 1px solid var(--vscode-border);
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--vscode-text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .vscode-input {
      background: var(--vscode-input);
      border: 1px solid var(--vscode-border);
      color: var(--vscode-text);
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 13px;
      transition: border-color 0.15s;
      outline: none;
      width: 100%;
      resize: vertical;
      font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
      line-height: 1.5;
    }

    .vscode-input:focus {
      border-color: var(--vscode-focus-ring);
      box-shadow: 0 0 0 1px rgba(0, 127, 212, 0.25);
    }

    .vscode-input::placeholder {
      color: var(--vscode-text-muted);
    }

    .vscode-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s;
      border: 1px solid transparent;
      white-space: nowrap;
      user-select: none;
      line-height: 1.4;
    }

    .vscode-btn-primary {
      background: var(--vscode-blue);
      color: #fff;
      border-color: var(--vscode-blue);
    }

    .vscode-btn-primary:hover {
      background: var(--vscode-blue-hover);
    }

    .vscode-btn-ghost {
      background: transparent;
      color: var(--vscode-text);
      border-color: transparent;
    }

    .vscode-btn-ghost:hover {
      background: var(--vscode-highlight);
    }

    .vscode-btn-outline {
      background: transparent;
      color: var(--vscode-text);
      border-color: var(--vscode-border);
    }

    .vscode-btn-outline:hover {
      background: var(--vscode-highlight);
      border-color: var(--vscode-border-light);
    }

    .vscode-btn-sm {
      padding: 3px 8px;
      font-size: 11px;
      gap: 3px;
    }

    .vscode-btn-xs {
      padding: 2px 6px;
      font-size: 10px;
      gap: 2px;
      border-radius: 2px;
    }

    .vscode-btn-icon {
      padding: 4px;
      min-width: 26px;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--vscode-text-secondary);
      transition: all 0.12s;
    }

    .vscode-btn-icon:hover {
      background: var(--vscode-highlight);
      color: var(--vscode-text);
    }

    .vscode-btn-icon-sm {
      padding: 2px;
      min-width: 22px;
      min-height: 22px;
    }

    .vscode-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 500;
      border-radius: 10px;
      background: var(--vscode-highlight);
      color: var(--vscode-text-secondary);
      line-height: 1.6;
    }

    .vscode-badge-accent {
      background: rgba(86, 156, 214, 0.2);
      color: var(--vscode-accent);
    }

    .vscode-badge-success {
      background: rgba(78, 201, 176, 0.18);
      color: var(--vscode-green);
    }

    .vscode-badge-warning {
      background: rgba(220, 220, 170, 0.18);
      color: var(--vscode-yellow);
    }

    .vscode-divider {
      border: none;
      border-top: 1px solid var(--vscode-border);
      margin: 0;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      cursor: pointer;
      border-radius: 3px;
      margin: 1px 6px;
      transition: all 0.1s;
      font-size: 13px;
      color: var(--vscode-text-secondary);
      user-select: none;
      border: 1px solid transparent;
    }

    .sidebar-nav-item:hover {
      background: var(--vscode-highlight);
      color: var(--vscode-text);
    }

    .sidebar-nav-item.active {
      background: var(--vscode-highlight);
      color: var(--vscode-text);
      border-color: var(--vscode-border);
    }

    .sidebar-nav-item .nav-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
    }

    .sidebar-nav-item.active .nav-icon {
      opacity: 1;
      color: var(--vscode-accent);
    }

    .sidebar-nav-item .nav-badge {
      margin-left: auto;
      font-size: 10px;
      background: var(--vscode-highlight);
      padding: 1px 6px;
      border-radius: 8px;
      min-width: 18px;
      text-align: center;
    }

    .vscode-toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      background: var(--vscode-panel);
      border: 1px solid var(--vscode-border-light);
      color: var(--vscode-text);
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    .vscode-code-block {
      background: var(--vscode-input);
      border: 1px solid var(--vscode-border);
      border-radius: 3px;
      padding: 8px 12px;
      font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--vscode-text);
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      max-height: 240px;
    }

    .vscode-search {
      display: flex;
      align-items: center;
      background: var(--vscode-input);
      border: 1px solid var(--vscode-border);
      border-radius: 3px;
      padding: 4px 8px;
      gap: 6px;
    }

    .vscode-search input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--vscode-text);
      font-size: 12px;
      width: 100%;
      font-family: inherit;
    }

    .vscode-search input::placeholder {
      color: var(--vscode-text-muted);
    }

    .vscode-search .search-icon {
      color: var(--vscode-text-muted);
      flex-shrink: 0;
    }

    .preset-chip {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--vscode-text-secondary);
      transition: all 0.1s;
      line-height: 1.4;
    }

    .preset-chip:hover {
      background: var(--vscode-highlight);
      color: var(--vscode-text);
      border-color: var(--vscode-border);
    }

    .slot-collapsed-bar {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      background: var(--vscode-panel);
      border: 1px solid var(--vscode-border);
      border-radius: 4px;
      color: var(--vscode-text-muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      user-select: none;
      transition: all 0.15s;
      padding: 10px 6px;
      width: 34px;
      min-width: 34px;
    }

    .slot-collapsed-bar:hover {
      background: var(--vscode-highlight);
      color: var(--vscode-text);
      border-color: var(--vscode-border-light);
    }

    .slot-collapsed-bar .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--vscode-green);
      flex-shrink: 0;
      writing-mode: horizontal-tb;
    }

    .lib-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 3px 3px 0 0;
      background: transparent;
      border: 1px solid transparent;
      color: var(--vscode-text-muted);
      transition: all 0.12s;
      user-select: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .lib-tab:hover {
      color: var(--vscode-text);
      background: var(--vscode-highlight);
    }

    .lib-tab.active {
      color: var(--vscode-text);
      background: var(--vscode-panel);
      border-color: var(--vscode-border);
      border-bottom-color: var(--vscode-panel);
      font-weight: 600;
    }

    .monaco-editor-container {
      flex: 1;
      min-height: 180px;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--vscode-border);
    }

    .monaco-editor-container:focus-within {
      border-color: var(--vscode-focus-ring);
      box-shadow: 0 0 0 1px rgba(0, 127, 212, 0.25);
    }

    .confirm-dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      animation: fadeSlideIn 0.15s ease-out;
    }

    .confirm-dialog {
      background: var(--vscode-panel);
      border: 1px solid var(--vscode-border-light);
      border-radius: 6px;
      padding: 16px 20px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .url-import-input {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      padding: 6px 8px;
      background: var(--vscode-input);
      border-radius: 4px;
      border: 1px solid var(--vscode-border);
    }

    .url-import-input input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--vscode-text);
      font-size: 11px;
      font-family: inherit;
    }

    .url-import-input input::placeholder {
      color: var(--vscode-text-muted);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    import * as React from "react";
    window.React = React;
  </script>

  <script type="text/babel">
    import { createRoot } from "react-dom/client";
    import {
      Copy, Check, Trash2, Braces, Wand2, Info, ChevronDown, ChevronRight,
      FileText, Sparkles, ArrowRight, X, BookOpen, Zap, Clipboard, Layers,
      RefreshCw, Code2, Library, History, Save, Plus,
      Pencil, Play, AlertTriangle, Clock, Tag, Search, FolderOpen, Terminal,
      FunctionSquare, ArrowLeft, Home, RotateCcw, Download,
      ExternalLink, MoreHorizontal, ListTree, Settings2, GripHorizontal,
      Pin, PinOff, PanelLeftClose, PanelLeftOpen, Columns3, Columns2,
      Upload, FileDown, Link, Globe,
    } from "lucide-react";
    import { create } from "zustand";
    import { Editor as MonacoEditor, loader as monacoLoader } from "@monaco-editor/react";

    // 配置 Monaco Editor 的 CDN 路径
    monacoLoader.config({
      paths: {
        vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
      }
    });

    // ==================== GitHub SVG图标 ====================
    const GitHubIcon = ({ size = 16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"
        style={{ opacity: 0.8 }}>
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z" />
      </svg>
    );

    // ==================== 内置转换器函数库 ====================
    const transformers = {
      base64: {
        label: "Base64 编码",
        desc: "将文本编码为 Base64 格式",
        category: "编码",
        icon: "🔐",
        fn: (val) => {
          try {
            return btoa(encodeURIComponent(val).replace(/%([0-9A-F]{2})/g, (_, p1) =>
              String.fromCharCode(parseInt(p1, 16))));
          } catch { return val; }
        },
      },
      base64decode: {
        label: "Base64 解码",
        desc: "将 Base64 格式解码为原始文本",
        category: "编码",
        icon: "🔓",
        fn: (val) => {
          try {
            return decodeURIComponent(atob(val).split("").map((c) =>
              "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
          } catch { return val; }
        },
      },
      upper: {
        label: "转大写",
        desc: "将所有字母转换为大写",
        category: "大小写",
        icon: "⬆️",
        fn: (val) => val.toUpperCase(),
      },
      lower: {
        label: "转小写",
        desc: "将所有字母转换为小写",
        category: "大小写",
        icon: "⬇️",
        fn: (val) => val.toLowerCase(),
      },
      capitalize: {
        label: "首字母大写",
        desc: "将每个单词的首字母大写",
        category: "大小写",
        icon: "✍️",
        fn: (val) =>
          val.split(" ").map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" "),
      },
      unicode: {
        label: "Unicode 转义",
        desc: "将字符转换为 \\uXXXX 格式",
        category: "编码",
        icon: "🔣",
        fn: (val) =>
          val.split("").map((c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0")).join(""),
      },
      rand_unicode_cjk: {
        label: "随机Unicode(CJK)",
        desc: "随机对CJK字符进行Unicode转义",
        category: "编码",
        icon: "🎲",
        fn: (val) =>
          val.split("").map((c) =>
            !/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af\u1100-\u11ff\u3130-\u318f]/
              .test(c) ? c :
              Math.random() > 0.5 ? c : ("\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"))
          ).join(""),
      },
      unicode_cjk: {
        label: "CJK Unicode",
        desc: "对所有CJK字符进行Unicode转义",
        category: "编码",
        icon: "🔣",
        fn: (val) =>
          val.split("").map((c) =>
            !/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af\u1100-\u11ff\u3130-\u318f]/
              .test(c) ? c :
              ("\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"))
          ).join(""),
      },
      unicodeDecode: {
        label: "Unicode 解码",
        desc: "将 \\uXXXX 转义序列还原",
        category: "编码",
        icon: "🔤",
        fn: (val) => val.replace(/\\u[\dA-Fa-f]{4}/g, (m) => String.fromCharCode(parseInt(m.slice(2),
          16))),
      },
      json: {
        label: "JSON 美化",
        desc: "将JSON字符串格式化（缩进2空格）",
        category: "数据",
        icon: "📋",
        fn: (val) => { try { return JSON.stringify(JSON.parse(val), null, 2); } catch { return val; } },
      },
      jsonCompact: {
        label: "JSON 压缩",
        desc: "将JSON字符串压缩为单行",
        category: "数据",
        icon: "📦",
        fn: (val) => { try { return JSON.stringify(JSON.parse(val)); } catch { return val; } },
      },
      urlEncode: {
        label: "URL 编码",
        desc: "将文本进行 URL 百分号编码",
        category: "编码",
        icon: "🔗",
        fn: (val) => { try { return encodeURIComponent(val); } catch { return val; } },
      },
      urlDecode: {
        label: "URL 解码",
        desc: "将 URL 百分号编码还原",
        category: "编码",
        icon: "🌐",
        fn: (val) => { try { return decodeURIComponent(val); } catch { return val; } },
      },
      trim: {
        label: "去除空格",
        desc: "去除文本首尾的空白字符",
        category: "文本",
        icon: "✂️",
        fn: (val) => val.trim(),
      },
      reverse: {
        label: "反转字符串",
        desc: "将字符串顺序颠倒",
        category: "文本",
        icon: "🔄",
        fn: (val) => val.split("").reverse().join(""),
      },
      escape: {
        label: "HTML 转义",
        desc: "转义 & < > \" ' 等HTML特殊字符",
        category: "编码",
        icon: "🛡️",
        fn: (val) => val.replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c])),
      },
      removeSpaces: {
        label: "移除空格",
        desc: "移除文本中所有空白字符",
        category: "文本",
        icon: "🧹",
        fn: (val) => val.replace(/\s+/g, ""),
      },
      slug: {
        label: "Slug 化",
        desc: "转换为URL友好的slug格式",
        category: "文本",
        icon: "🏷️",
        fn: (val) => val.toLowerCase().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-")
          .trim(),
      },
      double: {
        label: "重复一遍",
        desc: "将输入内容重复两次",
        category: "文本",
        icon: "📝",
        fn: (val) => val + val,
      },
      uuid: {
        label: "UUID",
        desc: "在末尾追加一个随机UUID",
        category: "编码",
        icon: "🔗",
        fn: (val) => val + " " + crypto.randomUUID(),
      },
    };

    const applyTransformer = (name, value, customFns = []) => {
      if (name.startsWith('fn:')) {
        const fnName = name.slice(3);
        const fnDef = customFns.find(f => f.name === fnName);
        if (fnDef && fnDef.code.trim()) {
          try {
            const fn = new Function('val', fnDef.code);
            const result = fn(value);
            return typeof result === 'string' ? result : String(result);
          } catch { return value; }
        }
        return value;
      }
      const t = transformers[name];
      if (!t) return value;
      return t.fn(value);
    };

    const getTransformerMeta = (name, customFns = []) => {
      if (name.startsWith('fn:')) {
        const fnName = name.slice(3);
        const fnDef = customFns.find(f => f.name === fnName);
        return fnDef ? {
          label: fnDef.name,
          desc: fnDef.description || '自定义JS函数',
          category: '自定义',
          icon: '⚡',
        } : { label: fnName, desc: '未知自定义函数', category: '自定义', icon: '❓' };
      }
      return transformers[name] || null;
    };

    // ==================== 解析工具 ====================
    const SLOT_REGEX = /\{(\w+)(?:\s*\|\s*([^}]+))?\}/g;
    const parseSlots = (template) => {
      const slots = [];
      const regex = new RegExp(SLOT_REGEX.source, "g");
      let match;
      while ((match = regex.exec(template)) !== null) {
        const rawTransformers = match[2] || "";
        const transformerList = rawTransformers.split("|").map((t) => t.trim()).filter(Boolean);
        slots.push({ name: match[1], transformers: transformerList, raw: match[0], index: match.index });
      }
      return slots;
    };
    const getUniqueSlotNames = (template) => {
      const slots = parseSlots(template);
      return [...new Set(slots.map((s) => s.name))];
    };
    const getAllTransformersForName = (template, name) => {
      const slots = parseSlots(template);
      const transformerSet = new Set();
      slots.filter((s) => s.name === name).forEach((s) => s.transformers.forEach((t) => transformerSet.add(t)));
      return [...transformerSet];
    };
    const computeResult = (template, inputs, customFns = []) => {
      if (!template) return "";
      const slots = parseSlots(template);
      const sorted = [...slots].sort((a, b) => b.index - a.index);
      let result = template;
      for (const slot of sorted) {
        const rawValue = inputs[slot.name] !== undefined ? inputs[slot.name] : "";
        let value = rawValue;
        for (const tName of slot.transformers) {
          value = applyTransformer(tName, value, customFns);
        }
        result = result.slice(0, slot.index) + value + result.slice(slot.index + slot.raw.length);
      }
      return result;
    };

    // ==================== localStorage 工具 ====================
    const loadFromStorage = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        return JSON.parse(raw);
      } catch { return fallback; }
    };
    const saveToStorage = (key, data) => {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch { /* quota exceeded */ }
    };

    // ==================== 预设示例 ====================
    const presets = [{

    }, {

      description: "翻译任务模板，使用大小写转换",

      inputs: {

    // 将预设转换为模板库条目格式
    const presetsAsLibraryEntries = () => presets.map(p => ({
      id: p.id,

      createdAt: new Date('2024-01-01').toISOString(),

    // ==================== Zustand Store ====================
    const HISTORY_MAX = 60;
    const getInitialTemplateLibrary = () => {
      const stored = loadFromStorage('prompt-merger-template-lib', null);
      if (stored !== null) return stored;
      // 首次使用，填充预设
      const entries = presetsAsLibraryEntries();
      saveToStorage('prompt-merger-template-lib', entries);
      return entries;

    const useStore = create((set, get) => ({
      template: "",
      inputs: {},
      expandedRef: false,
      lastCopied: null,
      customFunctions: loadFromStorage('prompt-merger-custom-fns', []),
      templateLibrary: getInitialTemplateLibrary(),
      history: loadFromStorage('prompt-merger-history', []),
      activeTab: 'workbench',
      toastMessage: null,
      sidebarCollapsed: false,
      slotPanelCollapsed: false,

      setTemplate: (template) => set({ template }),
      setInput: (name, value) => set((s) => ({ inputs: { ...s.inputs, [name]: value } })),
      setInputs: (inputs) => set({ inputs }),
      clearAll: () => set({ template: "", inputs: {}, lastCopied: null }),
      loadPreset: (preset) => set({
        template: preset.template, inputs: preset.inputs || {},
        lastCopied: null
      }),
      setExpandedRef: (v) => set({ expandedRef: v }),
      setLastCopied: (v) => set({ lastCopied: v }),
      setActiveTab: (v) => set({ activeTab: v }),
      toggleSidebar: () => set((s) => ({ sidebarCollapsed: !s.sidebarCollapsed })),
      toggleSlotPanel: () => set((s) => ({ slotPanelCollapsed: !s.slotPanelCollapsed })),
      showToast: (msg) => {
        set({ toastMessage: msg });
        setTimeout(() => set({ toastMessage: null }), 2500);
      },

      addCustomFunction: (fnDef) => {
        const newFn = { ...fnDef, id: crypto.randomUUID(), createdAt: new Date().toISOString() };
        set((s) => ({ customFunctions: [...s.customFunctions, newFn] }));
        get().showToast(`✅ 自定义函数 "${fnDef.name}" 已添加`);
      },
      updateCustomFunction: (id, updates) => {
        set((s) => ({
          customFunctions: s.customFunctions.map(f => f.id === id ? {
            ...f,
            ...updates,
            updatedAt: new Date().toISOString()
          } : f),
        }));
        get().showToast('✅ 自定义函数已更新');
      },
      deleteCustomFunction: (id) => {
        const fn = get().customFunctions.find(f => f.id === id);
        set((s) => ({ customFunctions: s.customFunctions.filter(f => f.id !== id) }));
        if (fn) get().showToast(`🗑️ 已删除 "${fn.name}"`);
      },

      saveToLibrary: (name, description, tags, templateData, inputsData) => {
        const template = templateData !== undefined ? templateData : get().template;
        const inputs = inputsData !== undefined ? inputsData : get().inputs;
        if (!template.trim()) { get().showToast('⚠️ 模板为空，无法保存'); return; }
        const entry = {
          id: crypto.randomUUID(),
          name: name || '未命名模板',

          tags: tags || [],
          template,
          inputs: { ...inputs },
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),

        set((s) => ({ templateLibrary: [...s.templateLibrary, entry] }));

      deleteFromLibrary: (id) => {

        set((s) => ({ templateLibrary: s.templateLibrary.filter(e => e.id !== id) }));
        if (entry) get().showToast(`🗑️ 已删除模板 "${entry.name}"`);
      },
      loadFromLibrary: (id) => {
        const entry = get().templateLibrary.find(e => e.id === id);
        if (entry) {
          set({ template: entry.template, inputs: { ...entry.inputs }, lastCopied: null });
          get().showToast(`📂 已加载模板 "${entry.name}"`);
        }
      },

      // 导入导出
      exportTemplateLibrary: () => {
        const data = {
          version: "1.0",
          type: "prompt-merger-template-library",
          exportedAt: new Date().toISOString(),
          templateLibrary: get().templateLibrary,
        };
        return JSON.stringify(data, null, 2);
      },
      exportCustomFunctions: () => {
        const data = {
          version: "1.0",
          type: "prompt-merger-custom-functions",
          exportedAt: new Date().toISOString(),
          customFunctions: get().customFunctions,
        };
        return JSON.stringify(data, null, 2);
      },
      exportAll: () => {
        const data = {
          version: "1.0",
          type: "prompt-merger-full-export",
          exportedAt: new Date().toISOString(),
          templateLibrary: get().templateLibrary,
          customFunctions: get().customFunctions,
        };
        return JSON.stringify(data, null, 2);
      },
      importData: (jsonData) => {
        try {
          const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
          if (!data || !data.type) throw new Error('无效的导入数据格式');

          let importedCount = 0;
          const state = get();

          if (data.templateLibrary && Array.isArray(data.templateLibrary)) {
            const existingIds = new Set(state.templateLibrary.map(e => e.id));
            const newEntries = data.templateLibrary.filter(e => !existingIds.has(e.id));
            if (newEntries.length > 0) {
              set((s) => ({ templateLibrary: [...s.templateLibrary, ...newEntries] }));
              importedCount += newEntries.length;
            }
          }

          if (data.customFunctions && Array.isArray(data.customFunctions)) {
            const existingIds = new Set(state.customFunctions.map(f => f.id));
            const existingNames = new Set(state.customFunctions.map(f => f.name));
            const newFns = data.customFunctions.filter(f =>
              !existingIds.has(f.id) && !existingNames.has(f.name)
            );
            if (newFns.length > 0) {
              set((s) => ({ customFunctions: [...s.customFunctions, ...newFns] }));
              importedCount += newFns.length;
            }
          }

          if (importedCount > 0) {
            get().showToast(`📥 成功导入 ${importedCount} 个项目`);
          } else {
            get().showToast('ℹ️ 没有新的项目可导入（可能已存在）');
          }
          return true;
        } catch (e) {
          get().showToast(`❌ 导入失败: ${e.message}`);
          return false;
        }
      },

      pushHistory: () => {
        const { template, inputs, history } = get();
        if (!template.trim()) return;
        const lastEntry = history[0];
        if (lastEntry && lastEntry.template === template && JSON.stringify(lastEntry.inputs) === JSON.stringify(
          inputs)) {
          return;
        }
        const entry = {
          id: crypto.randomUUID(),
          template,
          inputs: { ...inputs },
          timestamp: new Date().toISOString(),
          label: template.slice(0, 60).replace(/\n/g, ' ') + (template.length > 60 ? '...' : ''),
        };
        const newHistory = [entry, ...history].slice(0, HISTORY_MAX);
        set({ history: newHistory });
      },
      restoreFromHistory: (id) => {
        const entry = get().history.find(h => h.id === id);
        if (entry) {
          set({ template: entry.template, inputs: { ...entry.inputs }, lastCopied: null });
          get().showToast('🕐 已从历史记录恢复');
        }
      },
      clearHistory: () => {
        set({ history: [] });
        get().showToast('🗑️ 历史记录已清空');
      },
      deleteHistoryEntry: (id) => {
        set((s) => ({ history: s.history.filter(h => h.id !== id) }));
      },
      fixHistoryToLibrary: (historyId, name) => {
        const entry = get().history.find(h => h.id === historyId);
        if (!entry) { get().showToast('⚠️ 未找到历史记录条目'); return; }
        const libEntry = {
          id: crypto.randomUUID(),
          name: name || '历史模板 - ' + new Date(entry.timestamp).toLocaleString('zh-CN', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }),
          description: '从历史记录固定的模板',
          tags: ['历史固定'],
          template: entry.template,
          inputs: { ...entry.inputs },
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };
        set((s) => ({ templateLibrary: [...s.templateLibrary, libEntry] }));
        get().showToast(`📌 已固定到模板库: "${libEntry.name}"`);
        return libEntry;
      },
    }));

    // 持久化订阅
    useStore.subscribe((state) => {
      saveToStorage('prompt-merger-custom-fns', state.customFunctions);
      saveToStorage('prompt-merger-template-lib', state.templateLibrary);
      saveToStorage('prompt-merger-history', state.history);
    });

    let historyDebounceTimer = null;
    useStore.subscribe((state, prev) => {
      if (state.template !== prev.template || JSON.stringify(state.inputs) !== JSON.stringify(prev.inputs)) {
        if (state.template.trim()) {
          clearTimeout(historyDebounceTimer);
          historyDebounceTimer = setTimeout(() => {
            useStore.getState().pushHistory();
          }, 2000);
        }
      }
    });

    // ==================== 确认弹窗组件 ====================
    function ConfirmDialog({ title, message, confirmLabel, confirmDanger, onConfirm, onCancel }) {

    // ==================== 组件 ====================
    function TransformerBadge({ name, valid, customFns = [] }) {
      const meta = getTransformerMeta(name, customFns);
      const displayName = meta ? meta.label : name;
      const isCustom = name.startsWith('fn:');
      const colorClass = valid ? (isCustom ? "vscode-badge-accent" : "vscode-badge") : "vscode-badge-warning";
      return (
        <span className={`vscode-badge ${colorClass}`} style={{ gap: '3px', fontSize: '10px' }}

          {meta?.icon || "❓"} {displayName}
          {!valid && <span style={{ fontSize: '9px', opacity: 0.6 }}>(未知)</span>}
          {isCustom && <span style={{ fontSize: '8px', opacity: 0.5 }}>自定义</span>}

    }

    function SlotInputCard({ slotName, allTransformers, value, onChange, template, customFns }) {
      const [showPreview, setShowPreview] = React.useState(false);
      const [previewCopied, setPreviewCopied] = React.useState(false);
      const slots = React.useMemo(() => parseSlots(template), [template]);
      const firstSlotForName = React.useMemo(() => slots.find((s) => s.name === slotName), [slots, slotName]);
      const previewValue = React.useMemo(() => {
        if (!firstSlotForName || firstSlotForName.transformers.length === 0) return null;
        let val = value || "";
        for (const tName of firstSlotForName.transformers) {
          val = applyTransformer(tName, val, customFns);
        }
        return val;
      }, [firstSlotForName, value, customFns]);
      const occurrenceCount = React.useMemo(() => slots.filter((s) => s.name === slotName).length, [slots,
        slotName
      ]);
      const transformerVariants = React.useMemo(() => {
        const variants = new Set();
        slots.filter((s) => s.name === slotName).forEach((s) => {
          const key = s.transformers.join("|") || "__none__";
          variants.add(key);
        });
        return [...variants].map((v) => v === "__none__" ? [] : v.split("|"));
      }, [slots, slotName]);
      const handleCopyPreview = async () => {
        if (!previewValue) return;
        try {
          await navigator.clipboard.writeText(previewValue);
          setPreviewCopied(true);
          setTimeout(() => setPreviewCopied(false), 1800);
        } catch { }
      };
      return (
        <div className="vscode-card animate-fade-slide-in" style={{ marginBottom: '8px' }}>

    function CustomFunctionEditor({ fnDef, onSave, onCancel, existingNames }) {
      const [name, setName] = React.useState(fnDef?.name || '');
      const [description, setDescription] = React.useState(fnDef?.description || '');
      const [code, setCode] = React.useState(fnDef?.code || '');
      const [testInput, setTestInput] = React.useState('');
      const [testOutput, setTestOutput] = React.useState('');
      const [testError, setTestError] = React.useState('');
      const [showTest, setShowTest] = React.useState(false);
      const nameError = !name.trim() ? '函数名不能为空' :
        /[^a-zA-Z0-9_]/.test(name) ? '函数名只能包含字母、数字和下划线' :
          existingNames.includes(name) && (!fnDef || fnDef.name !== name) ? '函数名已存在' : '';
      const codeError = !code.trim() ? '函数代码不能为空' : '';
      const handleTest = () => {
        setTestError('');
        if (codeError) { setTestError('请先填写函数代码'); return; }
        try {
          const fn = new Function('val', code);
          const result = fn(testInput);
          setTestOutput(typeof result === 'string' ? result : JSON.stringify(result, null, 2));
        } catch (e) {
          setTestError(`执行错误: ${e.message}`);
          setTestOutput('');
        }
      };
      const handleSubmit = () => {
        if (nameError || codeError) return;
        onSave({ name: name.trim(), description: description.trim(), code: code.trim() });
      };
      return (
        <div className="vscode-card animate-fade-slide-in" style={{ marginBottom: '10px' }}>
          <div style={{ padding: '10px 12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '10px' }}>
              <Terminal size={16} style={{ color: 'var(--vscode-green)' }} />
              <span style={{ fontWeight: 600, fontSize: '13px' }}>{fnDef ? '编辑自定义函数' : '新建自定义函数'}</span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '8px' }}>
              <div>
                <label style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', display: 'block', marginBottom: '2px' }}>函数名 <span style={{ color: 'var(--vscode-red)' }}>*</span></label>
                <input className="vscode-input" style={{ fontSize: '12px', padding: '5px 8px' }} placeholder="my_transform"
                  value={name} onChange={(e) => setName(e.target.value)} />
                {nameError && <span style={{ fontSize: '9px', color: 'var(--vscode-red)', display: 'block', marginTop: '2px' }}>{nameError}</span>}
                <span style={{ fontSize: '9px', color: 'var(--vscode-text-muted)', display: 'block', marginTop: '2px' }}>管道中使用: fn:{name || '...'}</span>
              </div>
              <div>
                <label style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', display: 'block', marginBottom: '2px' }}>描述</label>
                <input className="vscode-input" style={{ fontSize: '12px', padding: '5px 8px' }} placeholder="简要描述函数功能..."
                  value={description} onChange={(e) => setDescription(e.target.value)} />
              </div>
            </div>
            <div style={{ marginBottom: '8px' }}>
              <label style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', display: 'block', marginBottom: '2px' }}>函数代码 <span style={{ color: 'var(--vscode-red)' }}>*</span></label>
              <div style={{ position: 'relative' }}>
                <textarea className="vscode-input"
                  style={{ minHeight: '110px', fontSize: '12px', fontFamily: "'Cascadia Code','JetBrains Mono','Fira Code','SF Mono','Consolas',monospace", lineHeight: '1.6', resize: 'vertical' }}
                  spellCheck={false}
                  placeholder={`// 编写函数体，参数 val 是输入字符串\n// 使用 return 返回处理后的值\n\nreturn val.replace(/\\s+/g, ' ').trim().toUpperCase();`}
                  value={code} onChange={(e) => setCode(e.target.value)} />
                <span style={{ position: 'absolute', top: '4px', right: '8px', fontSize: '9px', color: 'var(--vscode-text-muted)', fontFamily: 'monospace' }}>JavaScript</span>
              </div>
              {codeError && <span style={{ fontSize: '9px', color: 'var(--vscode-red)', display: 'block', marginTop: '2px' }}>{codeError}</span>}
            </div>
            <div style={{ marginBottom: '10px' }}>
              <button className="vscode-btn vscode-btn-ghost vscode-btn-sm"
                onClick={() => setShowTest(!showTest)}
                style={{ fontSize: '11px' }}>
                <Play size={11} />{showTest ? '收起测试' : '测试函数'}</button>
              {showTest && (
                <div style={{ marginTop: '6px', padding: '8px', background: 'var(--vscode-input)', borderRadius: '3px' }}>
                  <div style={{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
                    <input className="vscode-input" style={{ fontSize: '11px', padding: '4px 8px', flex: 1 }}
                      placeholder="测试输入..." value={testInput} onChange={(e) => setTestInput(e.target.value)} />
                    <button className="vscode-btn vscode-btn-outline vscode-btn-sm" onClick={handleTest}><Play size={10} />运行</button>
                  </div>
                  {testError && <div style={{ padding: '6px 8px', background: 'rgba(244,71,71,0.1)', borderRadius: '3px', fontSize: '10px', color: 'var(--vscode-red)', display: 'flex', alignItems: 'flex-start', gap: '4px' }}><AlertTriangle size={11} style={{ flexShrink: 0, marginTop: '1px' }} />{testError}</div>}
                  {testOutput !== '' && !testError && (
                    <div className="vscode-code-block" style={{ maxHeight: '80px', fontSize: '11px', padding: '6px 8px', color: 'var(--vscode-green)' }}>{testOutput}</div>)}
                </div>
              )}
            </div>
            <div style={{ display: 'flex', gap: '6px', justifyContent: 'flex-end' }}>
              {onCancel && <button className="vscode-btn vscode-btn-ghost vscode-btn-sm" onClick={onCancel}>取消</button>}
              <button className="vscode-btn vscode-btn-primary vscode-btn-sm"
                onClick={handleSubmit} disabled={!!nameError || !!codeError}
                style={{ opacity: (!!nameError || !!codeError) ? 0.5 : 1 }}>
                <Save size={12} />{fnDef ? '更新函数' : '保存函数'}</button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== 主应用 ====================
    function App() {
      const store = useStore();
      const {
        template, inputs, setTemplate, setInput, clearAll, loadPreset,
        expandedRef, setExpandedRef, lastCopied, setLastCopied,
        customFunctions, templateLibrary, history,
        addCustomFunction, updateCustomFunction, deleteCustomFunction,
        saveToLibrary, deleteFromLibrary, loadFromLibrary,
        restoreFromHistory, clearHistory, deleteHistoryEntry,
        fixHistoryToLibrary, exportTemplateLibrary, exportCustomFunctions, exportAll, importData,
        activeTab, setActiveTab, toastMessage, showToast,
        sidebarCollapsed, toggleSidebar,
        slotPanelCollapsed, toggleSlotPanel,
      } = store;

      const slots = React.useMemo(() => parseSlots(template), [template]);
      const uniqueSlotNames = React.useMemo(() => getUniqueSlotNames(template), [template]);
      const slotCount = uniqueSlotNames.length;
      const result = React.useMemo(() => computeResult(template, inputs, customFunctions), [template, inputs,
        customFunctions
      ]);
      const resultCharCount = result.length;
      const hasTemplate = template.trim().length > 0;
      const hasResult = result.trim().length > 0;

      // 确认弹窗状态
      const [confirmDialog, setConfirmDialog] = React.useState(null);
      // URL导入状态
      const [showUrlImport, setShowUrlImport] = React.useState(false);
      const [urlImportValue, setUrlImportValue] = React.useState('');
      const [urlImportTarget, setUrlImportTarget] = React.useState('all'); // 'all' | 'library' | 'functions'
      const [urlImportLoading, setUrlImportLoading] = React.useState(false);

      // 隐藏的文件输入引用
      const fileInputRef = React.useRef(null);
      const [fileImportTarget, setFileImportTarget] = React.useState('all');

      const handleCopyResult = async () => {
        if (!hasResult) return;
        try {
          await navigator.clipboard.writeText(result);
          setLastCopied("result");
          setTimeout(() => setLastCopied(null), 2000);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = result;
          ta.style.cssText = "position:fixed;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setLastCopied("result");
          setTimeout(() => setLastCopied(null), 2000);
        }
      };
      const handleCopyTemplate = async () => {
        if (!hasTemplate) return;
        try {
          await navigator.clipboard.writeText(template);
          setLastCopied("template");
          setTimeout(() => setLastCopied(null), 2000);
        } catch {
          setLastCopied("template");
          setTimeout(() => setLastCopied(null), 2000);
        }
      };
      const handleLoadPreset = (preset) => {
        loadPreset(preset);
        setActiveTab('workbench');
      };

      // 下载JSON文件
      const downloadJSON = (filename, jsonString) => {
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // 处理文件导入
      const handleFileImport = (target = 'all') => {
        setFileImportTarget(target);
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileSelected = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            importData(ev.target.result);
          } catch (err) {
            showToast('❌ 文件解析失败');
          }
        };
        reader.onerror = () => showToast('❌ 文件读取失败');
        reader.readAsText(file);
        // 重置input以便可以重新选择同一文件
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      // 处理URL导入
      const handleUrlImport = async () => {
        if (!urlImportValue.trim()) {
          showToast('⚠️ 请输入URL');
          return;
        }
        setUrlImportLoading(true);
        try {
          const resp = await fetch(urlImportValue.trim());
          if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
          const text = await resp.text();
          importData(text);
          setShowUrlImport(false);
          setUrlImportValue('');
        } catch (err) {
          showToast(`❌ URL导入失败: ${err.message}`);
        } finally {
          setUrlImportLoading(false);
        }
      };

      const [showSaveDialog, setShowSaveDialog] = React.useState(false);
      const [saveName, setSaveName] = React.useState('');
      const [saveDesc, setSaveDesc] = React.useState('');
      const [saveTags, setSaveTags] = React.useState('');
      const [saveSourceHistoryId, setSaveSourceHistoryId] = React.useState(null);
      const [editingFn, setEditingFn] = React.useState(null);
      const [showNewFn, setShowNewFn] = React.useState(false);
      const [historyExpanded, setHistoryExpanded] = React.useState(false);
      const [libSearch, setLibSearch] = React.useState('');

        if (!libSearch.trim()) return templateLibrary;

        return templateLibrary.filter(e =>
          e.name.toLowerCase().includes(q) ||
          e.description.toLowerCase().includes(q) ||
          (e.tags || []).some(t => t.toLowerCase().includes(q)) ||
          e.template.toLowerCase().includes(q)
        );
      }, [templateLibrary, libSearch]);

      const filteredHistory = React.useMemo(() => {
        if (!libSearch.trim()) return history;
        const q = libSearch.toLowerCase();

          e.label.toLowerCase().includes(q) ||

            Boolean));

                      <>
                        {filteredHistory.length === 0 ? (
                          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px', color: 'var(--vscode-text-muted)', gap: '8px' }}>
                            <Clock size={32} style={{ opacity: 0.25 }} />
                            <p style={{ fontSize: '11px' }}>{history.length === 0 ? '暂无历史记录，在工作台编辑模板后将自动记录' : '没有匹配的历史记录'}</p>
                          </div>
                        ) : (
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: '8px' }}>
                            {filteredHistory.map((entry) => (
                              <div key={entry.id} className="vscode-card" style={{ padding: '10px', display: 'flex', flexDirection: 'column', gap: '6px', borderLeft: '3px solid rgba(220,220,170,0.35)' }}>
                                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
                                  <div style={{ flex: 1, minWidth: 0 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                                      <span className="vscode-badge" style={{ fontSize: '9px', background: 'rgba(220,220,170,0.2)', color: 'var(--vscode-yellow)' }}>临时</span>
                                      <span style={{ fontWeight: 600, fontSize: '12px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{entry.label.slice(0, 40)}</span>
                                    </div>
                                    <p style={{ fontSize: '9px', color: 'var(--vscode-text-muted)', margin: '3px 0 0' }}>
                                      <Clock size={9} style={{ display: 'inline', marginRight: '2px' }} />
                                      {new Date(entry.timestamp).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                    </p>
                                  </div>
                                  <div style={{ display: 'flex', gap: '1px', flexShrink: 0 }}>
                                    <button className="vscode-btn-icon vscode-btn-icon-sm"
                                      onClick={() => handleQuickFix(entry.id)}
                                      title="快速固定到模板库"
                                      style={{ color: 'var(--vscode-accent)' }}>
                                      <Pin size={11} /></button>
                                    <button className="vscode-btn-icon vscode-btn-icon-sm"
                                      onClick={() => handleOpenSaveDialog(entry.id)}
                                      title="固定并命名..."
                                      style={{ color: 'var(--vscode-green)', opacity: 0.7 }}>
                                      <Save size={11} /></button>
                                    <button className="vscode-btn-icon vscode-btn-icon-sm" onClick={() => { restoreFromHistory(entry.id); setActiveTab('workbench'); }} title="加载到工作台"><Download size={11} /></button>
                                    <button className="vscode-btn-icon vscode-btn-icon-sm" onClick={() => deleteHistoryEntry(entry.id)} title="删除" style={{ color: 'var(--vscode-red)', opacity: 0.6 }}><Trash2 size={11} /></button>
                                  </div>
                                </div>
                                <div className="vscode-code-block" style={{ maxHeight: '55px', fontSize: '10px', padding: '5px 8px', opacity: 0.85 }}>{entry.template}</div>
                                <div style={{ display: 'flex', gap: '4px', flexWrap: 'wrap', alignItems: 'center' }}>
                                  <span style={{ fontSize: '9px', color: 'var(--vscode-text-muted)' }}>
                                    {Object.keys(entry.inputs || {}).length} 个已填变量
                                  </span>
                                  <button className="vscode-btn vscode-btn-ghost vscode-btn-xs"
                                    onClick={() => handleQuickFix(entry.id)}
                                    style={{ marginLeft: 'auto', fontSize: '9px', color: 'var(--vscode-accent)' }}
                                    title="使用自动名称快速固定">
                                    <Pin size={8} />快速固定</button>
                                </div>
                              </div>))}
                          </div>)}
                      </>
                    )}
                  </div>
                </div>
              )}

              {/* 自定义函数 */}
              {activeTab === 'functions' && (
                <div className="animate-fade-slide-in" style={{ height: '100%', display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px', flexWrap: 'wrap', gap: '6px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <FunctionSquare size={16} style={{ color: 'var(--vscode-green)' }} />
                      <span style={{ fontWeight: 600, fontSize: '14px' }}>自定义管道函数</span>
                      <span className="vscode-badge">{customFunctions.length} 个</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' }}>
                      <button className="vscode-btn vscode-btn-primary vscode-btn-sm"
                        onClick={() => {
                          setEditingFn(null);
                          setShowNewFn(true);
                        }}>
                        <Plus size={12} />新建函数</button>
                      <button className="vscode-btn vscode-btn-outline vscode-btn-sm"
                        onClick={() => {
                          const json = exportCustomFunctions();
                          downloadJSON(`prompt-custom-fns-${new Date().toISOString().slice(0, 10)}.json`, json);
                          showToast('📤 自定义函数已导出');
                        }}
                        title="导出自定义函数JSON">
                        <FileDown size={11} />导出
                      </button>
                      <button className="vscode-btn vscode-btn-outline vscode-btn-sm"
                        onClick={() => handleFileImport('functions')}
                        title="从文件导入自定义函数">
                        <Upload size={11} />导入文件
                      </button>
                      <button className="vscode-btn vscode-btn-outline vscode-btn-sm"
                        onClick={() => {
                          setShowUrlImport(true);
                          setUrlImportTarget('functions');
                          setUrlImportValue('');
                        }}
                        title="从URL导入自定义函数">
                        <Globe size={11} />URL导入
                      </button>
                      <button className="vscode-btn vscode-btn-outline vscode-btn-sm"
                        onClick={() => {
                          const json = exportAll();
                          downloadJSON(`prompt-merger-full-export-${new Date().toISOString().slice(0, 10)}.json`, json);
                          showToast('📤 全部数据已导出（模板库+函数）');
                        }}
                        title="导出全部数据">
                        <FileDown size={11} />导出全部
                      </button>
                    </div>
                  </div>
                  <div style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', marginBottom: '8px' }}>
                    在模板管道中使用 <code style={{ background: 'var(--vscode-input)', padding: '1px 4px', borderRadius: '2px', fontSize: '10px', fontFamily: 'monospace' }}>fn:函数名</code> 调用。函数接收 <code style={{ background: 'var(--vscode-input)', padding: '1px 4px', borderRadius: '2px', fontSize: '10px', fontFamily: 'monospace' }}>val</code> 参数，需用 <code style={{ background: 'var(--vscode-input)', padding: '1px 4px', borderRadius: '2px', fontSize: '10px', fontFamily: 'monospace' }}>return</code> 返回处理结果。
                  </div>
                  <div style={{ flex: 1, overflowY: 'auto', minHeight: 0 }}>
                    {showNewFn && (
                      <CustomFunctionEditor
                        fnDef={null}
                        existingNames={existingFnNames.filter(n => n !== editingFn?.name)}
                        onSave={(def) => {
                          addCustomFunction(def);
                          setShowNewFn(false);
                        }}
                        onCancel={() => setShowNewFn(false)}
                      />)}

                    {customFunctions.length === 0 && !showNewFn ? (
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px', color: 'var(--vscode-text-muted)', gap: '8px' }}>
                        <Code2 size={32} style={{ opacity: 0.25 }} />
                        <p style={{ fontSize: '11px' }}>暂无自定义函数</p>
                        <code style={{ fontSize: '10px', fontFamily: 'monospace', background: 'var(--vscode-input)', padding: '4px 10px', borderRadius: '4px', color: 'var(--vscode-text-secondary)' }}>
                          return val.replace(/\s+/g, ' ').trim().toUpperCase();</code>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                        {customFunctions.map((fn) => (
                          <div key={fn.id} className="vscode-card" style={{ padding: '8px 10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '4px' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                <Terminal size={13} style={{ color: 'var(--vscode-green)' }} />
                                <code style={{ fontWeight: 600, fontSize: '12px', color: 'var(--vscode-green)', fontFamily: 'monospace' }}>fn:{fn.name}</code>
                                {fn.description && <span style={{ fontSize: '10px', color: 'var(--vscode-text-muted)' }}>— {fn.description}</span>}
                              </div>
                              <div style={{ display: 'flex', gap: '2px' }}>
                                <button className="vscode-btn-icon vscode-btn-icon-sm" onClick={() => {
                                  setEditingFn(fn);
                                  setShowNewFn(false);
                                }} title="编辑"><Pencil size={11} /></button>
                                <button className="vscode-btn-icon vscode-btn-icon-sm"
                                  onClick={() => {
                                    setConfirmDialog({
                                      title: '删除自定义函数',
                                      message: `确定要删除自定义函数"${fn.name}"吗？此操作不可撤销。模板中使用该函数的管道将失效。`,
                                      confirmLabel: '删除',
                                      confirmDanger: true,
                                      onConfirm: () => {
                                        deleteCustomFunction(fn.id);
                                        setConfirmDialog(null);
                                      },
                                      onCancel: () => setConfirmDialog(null),
                                    });
                                  }}
                                  title="删除" style={{ color: 'var(--vscode-red)', opacity: 0.6 }}><Trash2 size={11} /></button>
                              </div>
                            </div>
                            <div className="vscode-code-block" style={{ maxHeight: '50px', fontSize: '10px', padding: '5px 8px' }}>{fn.code}</div>
                            <div style={{ fontSize: '9px', color: 'var(--vscode-text-muted)', marginTop: '3px' }}>
                              创建于 {new Date(fn.createdAt).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                              {fn.updatedAt && ` · 更新于 ${new Date(fn.updatedAt).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`}
                            </div>
                            {editingFn?.id === fn.id && (
                              <div style={{ marginTop: '8px', paddingTop: '8px', borderTop: '1px solid var(--vscode-border)' }}>
                                <CustomFunctionEditor
                                  fnDef={fn}
                                  existingNames={existingFnNames.filter(n => n !== fn.name)}
                                  onSave={(def) => {
                                    updateCustomFunction(fn.id, def);
                                    setEditingFn(null);
                                  }}
                                  onCancel={() => setEditingFn(null)}
                                /></div>)}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* 保存对话框 */}
          {showSaveDialog && (
            <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(2px)' }}
              onClick={() => {
                setShowSaveDialog(false);
                setSaveSourceHistoryId(null);
              }}>
              <div className="vscode-card animate-fade-slide-in" style={{ width: '100%', maxWidth: '420px', padding: '14px 16px' }}
                onClick={(e) => e.stopPropagation()}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '12px' }}>
                  {saveSourceHistoryId ? <Pin size={15} style={{ color: 'var(--vscode-accent)' }} /> : <Save size={15} style={{ color: 'var(--vscode-accent)' }} />}
                  <span style={{ fontWeight: 600, fontSize: '13px' }}>
                    {saveSourceHistoryId ? '固定历史模板到模板库' : '保存到模板库'}
                  </span>
                  {saveSourceHistoryId && (
                    <span className="vscode-badge" style={{ fontSize: '9px', background: 'rgba(220,220,170,0.2)', color: 'var(--vscode-yellow)' }}>从历史记录</span>
                  )}
                </div>
                <div style={{ marginBottom: '8px' }}>
                  <label style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', display: 'block', marginBottom: '3px' }}>模板名称 <span style={{ color: 'var(--vscode-red)' }}>*</span></label>
                  <input className="vscode-input" style={{ fontSize: '12px', padding: '5px 8px' }} placeholder="给模板起个名字..."
                    value={saveName} onChange={(e) => setSaveName(e.target.value)} autoFocus />
                </div>
                <div style={{ marginBottom: '8px' }}>
                  <label style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', display: 'block', marginBottom: '3px' }}>描述</label>
                  <textarea className="vscode-input" style={{ fontSize: '12px', minHeight: '50px', resize: 'vertical', padding: '5px 8px' }} placeholder="简要描述模板用途..."
                    rows={2} value={saveDesc} onChange={(e) => setSaveDesc(e.target.value)} />
                </div>
                <div style={{ marginBottom: '12px' }}>
                  <label style={{ fontSize: '10px', color: 'var(--vscode-text-muted)', display: 'block', marginBottom: '3px' }}>标签（逗号分隔）</label>
                  <input className="vscode-input" style={{ fontSize: '12px', padding: '5px 8px' }} placeholder="例如：翻译, 代码, API"
                    value={saveTags} onChange={(e) => setSaveTags(e.target.value)} />
                </div>
                <div style={{ display: 'flex', gap: '6px', justifyContent: 'flex-end' }}>
                  <button className="vscode-btn vscode-btn-ghost vscode-btn-sm"
                    onClick={() => {
                      setShowSaveDialog(false);
                      setSaveSourceHistoryId(null);
                    }}>取消</button>
                  <button className="vscode-btn vscode-btn-primary vscode-btn-sm"
                    onClick={handleConfirmSave}
                    disabled={!saveName.trim()}
                    style={{ opacity: !saveName.trim() ? 0.5 : 1 }}>
                    {saveSourceHistoryId ? <><Pin size={11} />固定保存</> : <><Save size={11} />保存</>}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);

    // 添加旋转动画
    const spinStyle = document.createElement('style');
    spinStyle.textContent = '@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
    document.head.appendChild(spinStyle);
  </script>
</body>

</html>
