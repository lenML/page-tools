<!DOCTYPE html>
<html data-theme="dark">

<head>
  <script type="importmap">
    {
      "imports": {
        "@jsxImportSource": "https://esm.sh/react@19.2.4",
        "react": "https://esm.sh/react@19.2.4",
        "react/jsx-runtime": "https://esm.sh/react@19.2.4/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
        "lucide-react": "https://esm.sh/lucide-react?external=react",
        "zustand": "https://esm.sh/zustand?external=react",
        "@fingerprintjs/fingerprintjs": "https://esm.sh/@fingerprintjs/fingerprintjs@4"
      }
    }
  </script>
  <script type="module" src="https://esm.sh/tsx"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    [data-theme="dark"] {
      --color-base-100: #1e1e1e;
      --color-base-200: #252526;
      --color-base-300: #3e3e42;
      --color-base-content: #cccccc;
      --color-primary: #0078d4;
      --color-primary-content: #ffffff;
      --color-secondary: #37373d;
      --color-secondary-content: #cccccc;
      --color-accent: #007acc;
      --color-accent-content: #ffffff;
      --color-neutral: #3e3e42;
      --color-neutral-content: #cccccc;
      --color-info: #75beff;
      --color-info-content: #1e1e1e;
      --color-success: #89d185;
      --color-success-content: #1e1e1e;
      --color-warning: #cca700;
      --color-warning-content: #1e1e1e;
      --color-error: #f48771;
      --color-error-content: #1e1e1e;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 3px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #4f4f4f;
    }

    /* 限制长代码块高度 */
    .component-value {
      max-height: 120px;
      overflow-y: auto;
    }

    .component-value::-webkit-scrollbar {
      width: 4px;
    }

    .component-value::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <!-- 用于 Puppeteer 对接的全局 Promise -->
  <script>
    (() => {
      let resolveData;
      window.__fingerprintDataPromise = new Promise((resolve) => {
        resolveData = resolve;
      });
      window.getFingerprintResult = () => window.__fingerprintDataPromise;
      window.__resolveFingerprintData = resolveData;
    })();
  </script>

  <div id="root"></div>

  <script type="text/babel">
    import * as React from "react";
    window.React = React;
  </script>

  <script type="text/babel">
    import { createRoot } from "react-dom/client"
    import {
      Fingerprint, Globe, MapPin, Clock, Building, Hash, Loader2,
      Monitor, Cpu, Wifi, Layout, Smartphone, Layers, Info, Search, X
    } from "lucide-react"
    import { create } from "zustand"
    import FingerprintJS from "@fingerprintjs/fingerprintjs"

    // 全局状态管理（指纹、IP、加载状态）
    const useStore = create((set) => ({
      fingerprint: null,
      fingerprintComponents: null,
      ipData: null,
      loading: true,
      error: null,
      setResult: (result) => set({
        fingerprint: result.visitorId,
        fingerprintComponents: result.components,
      }),
      setIpData: (ipData) => set({ ipData }),
      setLoading: (loading) => set({ loading }),
      setError: (error) => set({ error }),
    }))

    // 辅助函数
    function formatComponentValue(value) {
      if (value === null || value === undefined) return 'null';
      if (typeof value === 'object') {
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return String(value);
        }
      }
      return String(value);
    }

    function getComponentIcon(name) {
      const lower = name.toLowerCase();
      if (lower.includes('canvas')) return <Layout className="w-4 h-4" />;
      if (lower.includes('audio')) return <Wifi className="w-4 h-4" />;
      if (lower.includes('screen') || lower.includes('display')) return <Monitor className="w-4 h-4" />;
      if (lower.includes('timezone') || lower.includes('time')) return <Clock className="w-4 h-4" />;
      if (lower.includes('hardware') || lower.includes('cpu') || lower.includes('cores')) return <Cpu className="w-4 h-4" />;
      if (lower.includes('platform') || lower.includes('vendor')) return <Smartphone className="w-4 h-4" />;
      if (lower.includes('language') || lower.includes('fonts')) return <Layers className="w-4 h-4" />;
      return <Info className="w-4 h-4" />;
    }

    // 右侧面板组件（独立以使用搜索状态）
    function FingerprintPanel({ components }) {
      const [searchTerm, setSearchTerm] = React.useState('');

      const filtered = React.useMemo(() => {
        if (!components) return [];
        if (!searchTerm.trim()) return Object.entries(components);
        const lowerSearch = searchTerm.toLowerCase();
        return Object.entries(components).filter(([key]) =>
          key.toLowerCase().includes(lowerSearch)
        );
      }, [components, searchTerm]);

      return (
        <div className="flex-1 flex flex-col min-w-0">
          {/* 顶栏：标题 + 搜索框 + 项目链接 */}
          <div className="p-3 border-b border-base-300 bg-base-200">
            <div className="flex items-center justify-between gap-3">
              <h2 className="text-lg font-semibold text-base-content flex items-center gap-2 shrink-0">
                <Layers className="w-5 h-5 text-primary" />
                指纹组件详情
                <span className="text-sm font-normal text-base-content/50">
                  ({components ? Object.keys(components).length : 0} 项)
                </span>
              </h2>
              <div className="flex-1 flex justify-end items-center gap-2">
                <div className="relative">
                  <input
                    type="text"
                    placeholder="搜索组件..."
                    className="input input-sm input-bordered bg-base-100 text-base-content w-44 md:w-56"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                  {searchTerm ? (
                    <button
                      className="absolute right-2 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-base-content"
                      onClick={() => setSearchTerm('')}
                    >
                      <X className="w-3.5 h-3.5" />
                    </button>
                  ) : (
                    <Search className="absolute right-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-base-content/40" />
                  )}
                </div>
                <a
                  href="https://github.com/lenml/page-tools/tree/main/pages/myfp"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-base-content/50 hover:text-primary transition-colors shrink-0 hidden sm:inline"
                  title="项目地址"
                >
                  🔗 项目地址
                </a>
              </div>
            </div>
          </div>

          {/* 组件网格 */}
          <div className="flex-1 overflow-y-auto custom-scroll p-3">
            {filtered.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                {filtered.map(([key, component]) => {
                  const valueStr = component.value !== undefined
                    ? formatComponentValue(component.value)
                    : formatComponentValue(component);
                  return (
                    <div key={key} className="card bg-base-200 border border-base-300 shadow-sm hover:shadow-md transition-shadow">
                      <div className="card-body p-3">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="text-primary">{getComponentIcon(key)}</span>
                          <h3 className="font-medium text-sm text-base-content capitalize leading-tight">
                            {key.replace(/([A-Z])/g, ' $1').replace(/_/g, ' ')}
                          </h3>
                          {component.duration !== undefined && (
                            <span className="text-xs text-base-content/30 ml-auto">{component.duration}ms</span>
                          )}
                        </div>
                        <div className="bg-base-100 rounded-lg p-2 component-value">
                          <pre className="text-xs text-base-content whitespace-pre-wrap break-all font-mono leading-relaxed">
                            {valueStr}
                          </pre>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="text-center text-base-content/40 py-8">
                {searchTerm ? '没有匹配的组件' : '没有可用的组件数据'}
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const {
        fingerprint, fingerprintComponents, ipData, loading, error,
        setResult, setIpData, setLoading, setError
      } = useStore()

      React.useEffect(() => {
        async function fetchData() {
          try {
            setLoading(true)
            const fp = await FingerprintJS.load()
            const result = await fp.get()
            setResult(result)

            const response = await fetch("https://ipinfo.io/json")
            const data = await response.json()
            setIpData(data)
            setError(null)

            // 通过全局函数暴露给 Puppeteer
            if (window.__resolveFingerprintData) {
              window.__resolveFingerprintData({
                fingerprint: result.visitorId,
                components: result.components,
                ipData: data,
              });
            }
          } catch (err) {
            console.error(err)
            const errorMsg = "获取信息失败，请检查网络连接或稍后重试。";
            setError(errorMsg)

            if (window.__resolveFingerprintData) {
              window.__resolveFingerprintData({
                error: errorMsg,
                fingerprint: null,
                components: null,
                ipData: null,
              });
            }
          } finally {
            setLoading(false)
          }
        }
        fetchData()
      }, [])

      if (loading) {
        return (
          <div className="h-screen flex items-center justify-center bg-base-100">
            <div className="flex flex-col items-center gap-4">
              <Loader2 className="w-12 h-12 animate-spin text-primary" />
              <span className="text-base-content/70 text-sm">正在检测浏览器指纹与IP信息...</span>
            </div>
          </div>
        )
      }

      if (error) {
        return (
          <div className="h-screen flex items-center justify-center bg-base-100">
            <div className="card bg-base-200 shadow-xl border border-base-300 max-w-md w-full">
              <div className="card-body items-center text-center">
                <div className="text-error text-4xl mb-2">⚠️</div>
                <h2 className="card-title text-error">检测失败</h2>
                <p className="text-base-content/70">{error}</p>
                <div className="card-actions mt-4">
                  <button className="btn btn-primary" onClick={() => location.reload()}>
                    重新检测
                  </button>
                </div>
              </div>
            </div>
          </div>
        )
      }

      return (
        <div className="h-screen flex overflow-hidden bg-base-100">
          {/* 左侧面板：IP 信息 + 指纹摘要 */}
          <div className="w-80 lg:w-96 flex-shrink-0 border-r border-base-300 overflow-y-auto custom-scroll p-4">
            <div className="space-y-4">
              <div className="text-center mb-6">
                <h1 className="text-xl font-bold text-base-content flex items-center justify-center gap-2">
                  <Fingerprint className="w-6 h-6 text-primary" />
                  浏览器指纹
                </h1>
              </div>

              {/* 指纹 ID 卡片 */}
              <div className="card bg-base-200 shadow-md border border-base-300">
                <div className="card-body p-4">
                  <h2 className="card-title text-sm text-base-content/70 flex items-center gap-2">
                    <Hash className="w-4 h-4 text-primary" />
                    指纹ID
                  </h2>
                  <div className="bg-base-300 rounded-lg p-3 mt-1">
                    <code className="text-info text-xs break-all select-all">{fingerprint}</code>
                  </div>
                </div>
              </div>

              {/* IP 信息卡片 */}
              <div className="card bg-base-200 shadow-md border border-base-300">
                <div className="card-body p-4">
                  <h2 className="card-title text-sm text-base-content/70 flex items-center gap-2">
                    <Globe className="w-4 h-4 text-primary" />
                    IP 信息
                  </h2>
                  <div className="space-y-3 mt-2">
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-base-content/50 flex items-center gap-1"><Globe className="w-3 h-3" /> IP</span>
                      <span className="font-mono text-base-content">{ipData?.ip}</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-base-content/50 flex items-center gap-1"><MapPin className="w-3 h-3" /> 城市</span>
                      <span className="text-base-content">{ipData?.city || '未知'}</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-base-content/50 flex items-center gap-1"><MapPin className="w-3 h-3" /> 地区</span>
                      <span className="text-base-content">{ipData?.region || '未知'}</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-base-content/50 flex items-center gap-1"><Globe className="w-3 h-3" /> 国家</span>
                      <span className="text-base-content">{ipData?.country || '未知'}</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-base-content/50 flex items-center gap-1"><MapPin className="w-3 h-3" /> 坐标</span>
                      <span className="text-base-content font-mono text-xs">{ipData?.loc || '未知'}</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-base-content/50 flex items-center gap-1"><Clock className="w-3 h-3" /> 时区</span>
                      <span className="text-base-content">{ipData?.timezone || '未知'}</span>
                    </div>
                    {ipData?.org && (
                      <div className="flex justify-between items-center text-sm">
                        <span className="text-base-content/50 flex items-center gap-1"><Building className="w-3 h-3" /> ISP</span>
                        <span className="text-base-content text-right max-w-[180px] truncate">{ipData.org}</span>
                      </div>
                    )}
                    {ipData?.postal && (
                      <div className="flex justify-between items-center text-sm">
                        <span className="text-base-content/50 flex items-center gap-1"><Hash className="w-3 h-3" /> 邮编</span>
                        <span className="text-base-content">{ipData.postal}</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="text-center pt-2">
                <button className="btn btn-outline btn-primary btn-sm gap-2 w-full" onClick={() => location.reload()}>
                  <Loader2 className="w-4 h-4" /> 重新检测
                </button>
              </div>
            </div>
          </div>

          {/* 右侧面板：指纹组件详情（带搜索和网格布局） */}
          <FingerprintPanel components={fingerprintComponents} />
        </div>
      )
    }

    createRoot(document.getElementById("root")).render(<App />)
  </script>
</body>

</html>
